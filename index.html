function clearLog(){ document.getElementById('logBody').innerHTML=''; }
function clearBanners(){ document.getElementById('bannerLayer').innerHTML=''; }

function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

// 한국어 조사(이/가, 을/를) 자동 보정: 이름 마지막 글자의 받침 유무로 결정
function fixJosa(html){
  return html.replace(/<b>([^<]*)<\/b>(가|이|를\(을\)|을|를)/g, (m, name, p)=>{
    const clean = name.replace(/\s*\([^)]*\)\s*$/,'').replace(/\s*\d+$/,'');
    const ch = clean.charCodeAt(clean.length-1) - 0xAC00;
    const has = (ch>=0 && ch<=11171) ? (ch % 28)!==0 : false;
    let np;
    if(p==='가'||p==='이') np = has ? '이' : '가';
    else np = has ? '을' : '를';
    return '<b>'+name+'</b>'+np;
  });
}

function logEvent(html, color, showBanner){
  html = fixJosa(html);
  if(showBanner===undefined) showBanner = true;
  const body = document.getElementById('logBody');
  const line = document.createElement('div');
  line.className='log-line';
  const t = game ? fmtTime(game.elapsed) : '00:00';
  line.innerHTML = `<span class="t">${t}</span><span style="color:${color}">${html}</span>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
  while(body.children.length > 200){ body.removeChild(body.firstChild); }

  if(showBanner){
    playSound('skill');
    const layer = document.getElementById('bannerLayer');
    const b = document.createElement('div');
    b.className='banner';
    b.style.color = color;
    b.innerHTML = html;
    layer.appendChild(b);
    setTimeout(()=>{ if(b.parentNode) b.parentNode.removeChild(b); }, 2500);
    while(layer.children.length > 3){ layer.removeChild(layer.firstChild); }
  }
}

/* ============================================================
   MAIN LOOP
============================================================ */
let gameSpeed = 1;
function setSpeed(s){
  gameSpeed = s;
  const b2 = document.getElementById('btnSpeed2'), b3 = document.getElementById('btnSpeed3');
  if(b2) b2.classList.toggle('active', s===2);
  if(b3) b3.classList.toggle('active', s===3);
}
document.getElementById('btnSpeed2').addEventListener('click', ()=>setSpeed(gameSpeed===2 ? 1 : 2));
document.getElementById('btnSpeed3').addEventListener('click', ()=>setSpeed(gameSpeed===3 ? 1 : 3));

function loop(now){
  if(!game || game.finished){ return; }
  let dtReal = Math.min((now - game.lastTime)/1000, 0.05);
  game.lastTime = now;
  const total = dtReal * gameSpeed;
  const steps = Math.max(1, Math.ceil(total/0.02));
  const sdt = total/steps;
  for(let s=0; s<steps && !game.finished; s++){
    game.elapsed += sdt;
    update(sdt);
    checkWinCondition();
  }
  render();
  updateIntroOverlay();
  updateBossOverlay();
  updateStatusPanel();
  document.getElementById('gameTimer').textContent = fmtTime(game.elapsed);

  if(!game.finished){
    rafId = requestAnimationFrame(loop);
  }
}

/* ============================================================
   UPDATE
============================================================ */
function currentSpeedPx(b){
  const stat = b.overrideSpeed!==null ? b.overrideSpeed : b.speedStat;
  return stat * SPEED_K * (b.spdBuffTimer>0 ? 2 : 1);
}

function update(dt){
  const balls = game.balls;
  game.blackout = balls.some(x=>x.typeId==='choiseunghyun' && !x.eliminated && x.cs_phase==='fire');

  balls.forEach(b=>{
    if(b.eliminated) return;

    // 레드카드 퇴장: 판에서 제외, 매초 4 대미지
    if(b.expelTimer>0){
      b.expelTimer -= dt;
      if(b.expelTimer<=0) returnFromExpel(b);
      return;
    }
    if(b.nh_pushTimer>0){
      b.nh_pushTimer -= dt;
      if(b.nh_pushTimer<=0){ b.overrideSpeed = 0; b.nh_pauseTimer = 0.5; } // 밀려난 뒤 잠시 멈춤
    } else if(b.nh_pauseTimer>0){
      b.nh_pauseTimer -= dt;
      b.overrideSpeed = 0;
      if(b.nh_pauseTimer<=0){ b.overrideSpeed = null; } // 다시 이동
    }
    for(const k in b.nh_hitCd){ b.nh_hitCd[k] -= dt; }
    if(b.nh_cd>0) b.nh_cd -= dt;

    // virus infection tick (스킬/스턴/구독 등 어떤 상태에서도 항상 적용)
    if(b.virusInfectCooldown>0) b.virusInfectCooldown -= dt;
    if(b.virusStacks>0){
      const dmgPerSec = 2*b.virusStacks*(b.virusDmgMult||1);
      const vAmt = reduceIfFatKwontaemin(b, dmgPerSec)*dt;
      addStats(b, balls.find(x=>x.uid===b.virusSourceUid), Math.min(vAmt, Math.max(0,b.hp)));
      b.hp -= vAmt;
      if(b.hp<=0){ b.hp=0; eliminate(b, balls.find(x=>x.uid===b.virusSourceUid)); }
    }
    if(b.eliminated) return;

    // 구독 DoT: 7초 동안 매초 10 대미지(총 70), 어떤 상태에서도 적용
    if(b.oj_subSource!==undefined && b.oj_subTicks<7){
      b.oj_subElapsed += dt;
      while(b.oj_subTicks<7 && b.oj_subElapsed >= b.oj_subTicks+1){
        b.oj_subTicks++;
        const subSrc = balls.find(x=>x.uid===b.oj_subSource);
        dealDamage(b, bossScale(subSrc, 10), '구독', subSrc);
      }
      if(b.eliminated) return;
    }

    // eunbin: 등장 연출(4초 정지·무적) / 수산시장 / 숨김 상태
    if(b.typeId==='eunbin'){
      if(b.eb_graceTimer>0) b.eb_graceTimer -= dt;
      if(b.eb_hidden){
        b.eb_hiddenTimer -= dt;
        if(b.eb_hiddenTimer<=0) revealEunbin(b);
        return;
      }
    }

    // 최승현 선생님: 8초 이동 → 4초 폭죽타임(최탑, 검은 화면, 폭죽 8번)
    if(b.typeId==='choiseunghyun'){
      b.cs_timer += dt;
      if(b.cs_phase==='move'){
        if(b.cs_timer>=8){
          b.cs_phase='fire'; b.cs_timer=0; b.cs_fwCount=0;
          b.name='최탑'; b.ballLabel='최탑';
          logEvent(`<b>최승현</b>이 <b>최탑</b>으로 변신! "폭죽타임"`, b.color);
        }
      } else {
        while(b.cs_fwCount<8 && b.cs_timer >= b.cs_fwCount*0.5){
          const fr = unitToPx(24)/2;
          game.fireworks.push({x:rand(fr,BOARD_PX-fr), y:rand(fr,BOARD_PX-fr), age:0, delay:0.4, done:false, ownerUid:b.uid});
          b.cs_fwCount++;
        }
        if(b.cs_timer>=4){
          b.cs_phase='move'; b.cs_timer=0;
          b.name=b.baseName; b.ballLabel='최승현';
        }
      }
    }

    // 속도/공격력 버프 타이머
    if(b.spdBuffTimer>0) b.spdBuffTimer -= dt;
    if(b.atkBuffTimer>0) b.atkBuffTimer -= dt;
    if(b.spdBuffTimer>0){
      b.trail = b.trail || [];
      b.trail.push({x:b.x, y:b.y});
      if(b.trail.length>14) b.trail.shift();
    } else if(b.trail && b.trail.length){ b.trail = []; }

    // gippeum: 마사지 (스턴 중에도 타이머 진행)
    if(b.typeId==='gippeum' && b.chewedBy){
      // 먹히는 동안엔 마사지 진행/발동 없음, 뱉어진 뒤 쿨타임을 처음부터 다시 셈
      b.kj_state='cool'; b.kj_timer=0; b.kj_target=null;
    } else if(b.typeId==='gippeum'){
      if(b.kj_state==='cool'){
        b.kj_timer += dt;
        if(b.kj_timer>=5){ b.kj_state='ready'; b.kj_timer=0; }
      } else if(b.kj_state==='ready'){
        const zr = unitToPx(12)/2 * (b.sizeMult||1);
        for(const t of balls){
          if(t.uid===b.uid || t.eliminated || t.chewedBy || isUntargetable(t) || isSameTeam(b,t)) continue;
          const tr = unitToPx(t.size)/2;
          if(Math.hypot(t.x-b.x,t.y-b.y) < zr+tr){
            b.kj_state='massage'; b.kj_timer=2; b.kj_target=t.uid;
            b.stunTimeLeft = Math.max(b.stunTimeLeft,2); b.stunAnchorX=b.x; b.stunAnchorY=b.y;
            t.stunTimeLeft = Math.max(t.stunTimeLeft,2); t.stunAnchorX=t.x; t.stunAnchorY=t.y;
            logEvent(`<b>${escName(b)}</b>: "마사지!" — <b>${escName(t)}</b>와 함께 2초간 멈춤`, b.color);
            break;
          }
        }
      } else if(b.kj_state==='massage'){
        b.kj_timer -= dt;
        if(b.kj_timer<=0){
          const tg = balls.find(x=>x.uid===b.kj_target);
          logEvent(`<b>${escName(b)}</b>: "마사지 끝!"`, b.color);
          if(tg && !tg.eliminated){
            if(Math.random()<0.5){
              dealDamage(tg, bossScale(b,36), '마사지', b);
              tg.spdBuffTimer = 5;
              logEvent(`<b>${escName(tg)}</b>의 속도가 2배! (5초, 36 대미지)`, b.color);
            } else {
              dealDamage(tg, bossScale(b,52), '마사지', b);
              tg.atkBuffTimer = 5;
              logEvent(`<b>${escName(tg)}</b>의 공격력이 2배! (5초, 52 대미지)`, b.color);
            }
          }
          b.kj_state='cool'; b.kj_timer=0; b.kj_target=null;
        }
      }
    }

    // debuff timer (기세 하락 등 임시 크기/속도 변화)
    if(b.debuffTimeLeft>0){
      b.debuffTimeLeft -= dt;
      if(b.debuffTimeLeft<=0 && b.debuffRevert){
        b.size = Math.max(1, b.size - b.debuffRevert.sizeDelta);
        b.speedStat = Math.max(0.5, b.speedStat - b.debuffRevert.speedDelta);
        b.debuffRevert = null;
      }
    }

    // stun (덩크 등): 제자리에서 조금 떨며 정지
    if(b.stunTimeLeft>0){
      b.stunTimeLeft -= dt;
      const shake = 2;
      b.x = b.stunAnchorX + (Math.random()-0.5)*shake;
      b.y = b.stunAnchorY + (Math.random()-0.5)*shake;
      return;
    }

    // being chewed: frozen at attacker's mouth, taking damage over time
    if(b.chewedBy){
      const attacker = balls.find(x=>x.uid===b.chewedBy);
      if(attacker && !attacker.eliminated){
        b.x = attacker.x; b.y = attacker.y;
        b.chewTimeLeft -= dt;
        const cAmt = reduceIfFatKwontaemin(b, bossScale(attacker, 40/3))*dt;
        addStats(b, attacker, Math.min(cAmt, Math.max(0,b.hp)));
        b.hp -= cAmt;
        if(b.hp <= 0){ b.hp = 0; }
        if(b.chewTimeLeft <= 0){
          finishChew(attacker, b);
        }
      } else {
        // attacker gone, release
        b.chewedBy = null;
      }
      return; // no normal movement while chewed
    }

    // 씹는 중인 태민: 제자리에서 멈춰 부들부들 떨림
    if(b.kt_chewing){
      const shake = 2.5;
      b.x = b.kt_chewAnchorX + (Math.random()-0.5)*shake;
      b.y = b.kt_chewAnchorY + (Math.random()-0.5)*shake;
      return; // no normal movement while chewing someone
    }

    // subscribed (달라붙기): frozen next to target, dealing damage per second
    if(b.oj_subscribeTargetUid){
      const target = balls.find(x=>x.uid===b.oj_subscribeTargetUid);
      if(target && !target.eliminated){
        const tr = unitToPx(target.size)/2, r = unitToPx(b.size)/2;
        b.x = target.x + Math.cos(b.oj_subscribeAngle)*(tr+r);
        b.y = target.y + Math.sin(b.oj_subscribeAngle)*(tr+r);
        b.oj_subscribeTimeLeft -= dt;
        b.oj_subscribeTick += dt;
        if(b.oj_subscribeTick >= 1){
          b.oj_subscribeTick -= 1;
          dealDamage(target, bossScale(b, 10), '구독', b);
        }
        if(b.oj_subscribeTimeLeft <= 0 || target.eliminated){
          b.oj_subscribeTargetUid = null;
          const ang = rand(0,Math.PI*2);
          b.vx = Math.cos(ang); b.vy = Math.sin(ang);
        }
      } else {
        b.oj_subscribeTargetUid = null;
      }
      if(b.oj_subscribeTargetUid) return; // still attached, skip normal movement
    }

    // dongju: 불안(정지) <-> 폭주 상태
    if(b.typeId==='dongju'){
      if(b.dj_state==='anxious'){
        const shake = 2;
        b.x = b.dj_anchorX + (Math.random()-0.5)*shake;
        b.y = b.dj_anchorY + (Math.random()-0.5)*shake;
        b.dj_timer += dt;
        if(b.dj_timer >= 11){
          b.dj_state = 'active';
          b.dj_timer = 0;
          b.speedStat = 44;
          const ang = rand(0,Math.PI*2);
          b.vx = Math.cos(ang); b.vy = Math.sin(ang);
          logEvent(`<b>${escName(b)}</b>: "동주... 불안해!"`, b.color);
        }
        return; // 불안 상태에서는 이동하지 않음
      } else {
        for(const k in b.dj_hitCooldown){ b.dj_hitCooldown[k] -= dt; }
      }
    }

    // eunchong: F1 질주!
    if(b.typeId==='eunchong'){
      for(const k in b.f1_hitCd){ b.f1_hitCd[k] -= dt; }
      if(b.f1_state==='cool'){
        b.f1_timer += dt;
        if(b.f1_timer>=6){
          b.f1_state = 'active'; b.f1_timer = 4.5; b.f1_turn = 1.5;
          const a = rand(0,Math.PI*2);
          b.vx = Math.cos(a); b.vy = Math.sin(a);
          b.overrideSpeed = 15;
          logEvent(`<b>${escName(b)}</b>: "F1 질주!"`, b.color);
        }
      } else {
        b.f1_timer -= dt;
        b.f1_turn -= dt;
        if(b.f1_turn<=0){ b.f1_turn = 1.5; const a = rand(0,Math.PI*2); b.vx = Math.cos(a); b.vy = Math.sin(a); }
        b.overrideSpeed = 15;
        if(b.f1_timer<=0){ b.f1_state='cool'; b.f1_timer=0; b.overrideSpeed=null; }
      }
    }

    // hayul: 대회전(Q) / 몸 말아 웅크리기(W)
    if(b.typeId==='hayul'){
      if(b.hl_state==='wait'){
        b.hl_timer -= dt;
        if(b.hl_timer<=0){
          if(b.hl_next==='Q') hayulStartQ(b); else hayulStartW(b);
        }
      } else if(b.hl_state==='dash'){
        b.overrideSpeed = 20;
        // 고른 랜덤 상대를 향해 돌진 (벽에 닿으면 끝)
        const dtg = balls.find(x=>x.uid===b.hl_targetUid);
        b.hl_dashT = (b.hl_dashT||0) + dt;
        if(dtg && !dtg.eliminated && !isUntargetable(dtg)){
          const dd = Math.hypot(dtg.x-b.x, dtg.y-b.y);
          if(dd < unitToPx(b.size)/2 + unitToPx(dtg.size)/2 + 12){
            b.hl_targetUid = null; // 상대에게 닿으면 유도 종료, 그 방향 그대로 벽까지 돌진
          } else {
            const da = Math.atan2(dtg.y-b.y, dtg.x-b.x);
            b.vx = Math.cos(da); b.vy = Math.sin(da);
          }
        }
        if(b.hl_dashT>2.5){ b.hl_state='wait'; b.hl_timer=3; b.overrideSpeed=null; } // 안전장치
      } else if(b.hl_state==='spike'){
        b.hl_timer -= dt;
        if(b.hl_timer<=0){ hayulStartQ(b); }
      }
      for(const k in b.hl_hitCd){ b.hl_hitCd[k] -= dt; }
    }

    // siyoon: 암산 대결 타이머
    if(b.typeId==='siyoon'){
      b.hy_timer += dt;
      if(b.hy_timer >= 4){
        b.hy_timer = 0;
        const fa = randInt(1,9), fb = randInt(1,9);
        const mbRadius = unitToPx(6)/2;
        const mp = pickSpawnPosition(mbRadius, []);
        game.mathballs.push({
          uid: nextUid(), x:mp.x, y:mp.y, size:6,
          text: fa+'×'+fb, value: fa*fb, ownerUid: b.uid, alive:true
        });
        logEvent(`<b>${escName(b)}</b>: "암산 대결 신청!" (${fa}×${fb} 문제 등장)`, b.color);
      }
    }

    // uwoo: 공 던지고 주우러 이동 (본인은 속도 0, 고정된 채 스킬로만 이동)
    if(b.typeId==='uwoo'){
      b.uw_songTimer = (b.uw_songTimer||0) + dt;
      const uwR = unitToPx(b.size)/2;
      const onW = b.x-uwR<=4 || b.x+uwR>=BOARD_PX-4 || b.y-uwR<=4 || b.y+uwR>=BOARD_PX-4;
      // 벽에 멈춰 있을 때만 노래 공격 사용, 쓸 때마다 벽에서 잠시 멈춰 있음
      if(b.uw_songTimer>=3.6 && b.uw_state==='wait' && onW){
        b.uw_songTimer = 0;
        b.uw_timer = Math.max(b.uw_timer, 1);
        game.waves.push({uid:nextUid(), ownerUid:b.uid, x:b.x, y:b.y, radius:0, maxRadius:BOARD_PX/2, growSpeed:420, hitUids:new Set(), color:b.color});
        logEvent(`<b>${escName(b)}</b>: "노래 공격!"`, b.color);
      }
      if(b.uw_state==='wait'){
        b.uw_timer -= dt;
        if(b.uw_timer<=0 && onW){
          // 판 한 변의 길이를 1로 볼 때, 1 이상 떨어진 벽 지점으로만 던짐(불가능하면 가장 먼 쪽)
          const opts = [];
          for(let q=0;q<90;q++){ const a0 = q/90*Math.PI*2 + rand(0,0.06); opts.push({a:a0, d:uwWallDist(b.x,b.y,a0)}); }
          let good = opts.filter(o=>o.d >= BOARD_PX+15);
          if(good.length===0){ const mxd = Math.max(...opts.map(o=>o.d)); good = opts.filter(o=>o.d >= mxd*0.92); }
          const pk = choice(good);
          const dx = Math.cos(pk.a), dy = Math.sin(pk.a), tt = pk.d;
          game.uwBalls.push({uid:nextUid(), ownerUid:b.uid, x:b.x, y:b.y, px:b.x, py:b.y, x0:b.x, y0:b.y, x1:b.x+dx*tt, y1:b.y+dy*tt, t:0, dur:0.2, hit:new Set(), stopped:false});
          b.uw_state = 'fly';
          logEvent(`<b>${escName(b)}</b>: "공을 놓쳤다..."`, b.color);
        }
      } else if(b.uw_state==='dash'){
        b.uw_dashT += dt;
        const k = Math.min(1, b.uw_dashT/0.3);
        b.x = b.uw_sx + (b.uw_tx-b.uw_sx)*k;
        b.y = b.uw_sy + (b.uw_ty-b.uw_sy)*k;
        if(k>=1){
          game.uwBalls = game.uwBalls.filter(u=>u.ownerUid!==b.uid);
          b.uw_state = 'wait';
          b.uw_timer = 0.5;
          logEvent(`<b>${escName(b)}</b>: "공을 주웠다!"`, b.color);
        }
      }
      return;
    }

    // hyunseo: 다리털 4번 뽑으면 잠시 멈췄다가 8방향으로 다리털 발사
    if(b.typeId==='hyunseo' && b.hs_pauseTimer>0){
      b.hs_pauseTimer -= dt;
      const sk = 1.5;
      b.x = b.hs_anchorX + (Math.random()-0.5)*sk;
      b.y = b.hs_anchorY + (Math.random()-0.5)*sk;
      if(b.hs_pauseTimer<=0){
        b.hs_pauseTimer = 0;
        for(let q=0;q<8;q++){
          const a8 = q*Math.PI/4;
          game.hairs.push({uid:nextUid(), ownerUid:b.uid, x:b.x, y:b.y, px:b.x, py:b.y, dx:Math.cos(a8), dy:Math.sin(a8), hit:new Set()});
        }
        logEvent(`<b>${escName(b)}</b>: "다리털 대방출!" (8방향, 20 대미지)`, b.color);
      }
      return;
    }

    // hanbin: 농구 스킬
    if(b.typeId==='hanbin'){
      if(!b.hb_busy){
        b.hb_ballAngle += dt*3;
        b.hb_actionTimer += dt;
        if(b.hb_actionTimer >= 5){
          b.hb_actionTimer = 0;
          const others = balls.filter(x=>x.uid!==b.uid && !x.eliminated && !x.chewedBy && !isUntargetable(x) && !isSameTeam(b,x));
          if(others.length>0){
            if(Math.random()<0.5){
              // 3점슛: 가장 먼 상대에게 투척
              let target=others[0], bestD=-1;
              others.forEach(o=>{ const d=Math.hypot(o.x-b.x,o.y-b.y); if(d>bestD){ bestD=d; target=o; } });
              b.hb_busy = true;
              logEvent(`<b>${escName(b)}</b>: "3점슛!"`, b.color);
              const ang = Math.atan2(target.y-b.y, target.x-b.x);
              game.basketballs.push({
                uid: nextUid(), x:b.x, y:b.y, vx:Math.cos(ang), vy:Math.sin(ang),
                speedStat:11, catchupTimer:0, ownerUid:b.uid, targetUid:target.uid
              });
            } else {
              // 덩크: 가장 가까운 상대에게 돌진
              let target=others[0], bestD=Infinity;
              others.forEach(o=>{ const d=Math.hypot(o.x-b.x,o.y-b.y); if(d<bestD){ bestD=d; target=o; } });
              b.hb_busy = true;
              b.hb_dashTargetUid = target.uid;
              b.hb_dashSpeed = 15;
              b.hb_catchupTimer = 0;
              logEvent(`<b>${escName(b)}</b>: "덩크!"`, b.color);
            }
          }
        }
      } else if(b.hb_dashTargetUid){
        const target = balls.find(x=>x.uid===b.hb_dashTargetUid);
        if(!target || target.eliminated){
          b.hb_busy = false; b.hb_dashTargetUid = null; b.overrideSpeed = null;
        } else {
          const tr = unitToPx(target.size)/2, r = unitToPx(b.size)/2;
          const d = Math.hypot(target.x-b.x, target.y-b.y);
          if(d < tr+r){
            const dmg = bossScale(b, 30);
            dealDamage(target, dmg, '덩크', b);
            logEvent(`<b>${escName(target)}</b>이 ${escName(b)}의 덩크에 충격!`, b.color);
            target.stunTimeLeft = 1.5;
            target.stunAnchorX = target.x; target.stunAnchorY = target.y;
            b.hb_busy = false; b.hb_dashTargetUid = null; b.overrideSpeed = null;
            // 상대를 밀어내지 않고, 이한빈 본인이 공격 방향과 반대로 튕겨나감(코너 끼임 방지)
            b.vx = -b.vx; b.vy = -b.vy;
            return;
          }
          b.hb_catchupTimer += dt;
          if(b.hb_catchupTimer>=1){
            b.hb_catchupTimer -= 1;
            if(target.speedStat > b.hb_dashSpeed) b.hb_dashSpeed += 1;
          }
          const ang = Math.atan2(target.y-b.y, target.x-b.x);
          b.vx = Math.cos(ang); b.vy = Math.sin(ang);
          b.overrideSpeed = b.hb_dashSpeed;
        }
      }
    }

    // choiyeseong leg-break cycle
    if(b.typeId==='choiyeseong'){
      b.cy_legTimer += dt;
      if(!b.cy_legBroken && b.cy_legTimer >= 10){
        b.cy_legBroken = true;
        b.cy_legTimer = 0;
        b.overrideSpeed = 4;
        logEvent(`<b>${escName(b)}</b>의 다리가 부러짐!`, b.color);
      } else if(b.cy_legBroken && b.cy_legTimer >= 5){
        b.cy_legBroken = false;
        b.cy_legTimer = 0;
        if(b.bounceNeeded<=0) b.overrideSpeed = null;
        logEvent(`<b>${escName(b)}</b>의 다리가 회복됨!`, b.color);
      }
      b.cy_gloveAngle += dt * 2.7;
    }

    // kimsihoo frog spawn timer
    if(b.typeId==='kimsihoo'){
      b.ks_spawnTimer += dt;
      if(b.ks_spawnTimer >= 4.5){
        b.ks_spawnTimer = 0;
        game.frogs.push(spawnFrog(b.uid));
        logEvent(`<b>${escName(b)}</b>: "이기심이죠" — 은빈이 추가 소환!`, b.color);
      }
    }

    // uijoon vlog cycle
    if(b.typeId==='uijoon'){
      // 알림 설정 파동을 쏘는 중(대기+확산)에는 완전히 멈춰있음
      if(b.oj_pulseState==='charging'){
        b.oj_pulseTimer += dt;
        if(b.oj_pulseTimer >= 0.7){
          b.oj_pulseState = 'active';
          game.pulses.push({
            uid: nextUid(), x:b.x, y:b.y, radius:0, maxRadius:380,
            growSpeed:190, hitUids:new Set(), color:b.color, ownerUid:b.uid
          });
        }
        return;
      } else if(b.oj_pulseState==='active'){
        const stillActive = game.pulses.some(p=>p.ownerUid===b.uid);
        if(!stillActive){
          b.oj_pulseState = null;
        } else {
          return;
        }
      }

      b.oj_vlogTimer += dt;
      if(b.oj_likeTimeLeft>0) b.oj_likeTimeLeft -= dt;
      b.oj_likeAngle += dt*6;
      for(const k in b.oj_likeCooldown){ b.oj_likeCooldown[k]-=dt; }
      if(b.oj_vlogTimer >= 6 && !b.oj_subscribeTargetUid){
        b.oj_vlogTimer = 0;
        logEvent(`<b>${escName(b)}</b>: "브이로그 업로드!"`, b.color);
        const roll = Math.random();
        if(roll < 0.5){
          b.oj_likeTimeLeft = 2.5;
          logEvent(`<b>${escName(b)}</b>의 <b>좋아요</b>가 날아옵니다! (닿으면 20 대미지)`, b.color);
        } else if(roll < 0.8){
          logEvent(`<b>${escName(b)}</b>가 <b>알림 설정</b>! 잠시 후 파동이 퍼져나갑니다... (닿으면 50 대미지)`, b.color);
          b.oj_pulseState = 'charging';
          b.oj_pulseTimer = 0;
          return;
        } else {
          const others = balls.filter(x=>x.uid!==b.uid && !x.eliminated && !x.chewedBy && !isUntargetable(x) && !isSameTeam(b,x));
          if(others.length>0){
            let nearest = others[0], bestD = Infinity;
            others.forEach(o=>{
              const d = Math.hypot(o.x-b.x, o.y-b.y);
              if(d<bestD){ bestD=d; nearest=o; }
            });
            nearest.oj_subTicks = 0;
            nearest.oj_subElapsed = 0;
            nearest.oj_subSource = b.uid;
            nearest.oj_subColor = b.color;
            logEvent(`<b>${escName(b)}</b>가 <b>${escName(nearest)}</b>에게 <b>구독</b>! 7초간 70 대미지!`, b.color);
          }
        }
      }
      if(b.oj_subscribeTargetUid) return; // 구독 중이면 아래 이동 로직 스킵 (위에서 이미 처리됨)
    }

    if(b.kt_cooldown>0) b.kt_cooldown -= dt;
    if(b.kt_hitImmuneTimer>0) b.kt_hitImmuneTimer -= dt;
    for(const k in b.cy_gloveCooldown){ b.cy_gloveCooldown[k]-=dt; }
    for(const k in b.kt_hitCooldownMap){ b.kt_hitCooldownMap[k]-=dt; }
    for(const k in b.hs_hitCooldown){ b.hs_hitCooldown[k]-=dt; }

    // movement
    const speed = currentSpeedPx(b);
    const r = unitToPx(b.size)/2;
    b.x += b.vx * speed * dt;
    b.y += b.vy * speed * dt;

    // wall bounce
    let bounced=false;
    const hitSides=[];
    if(b.x - r < 0){ b.x = r; b.vx = Math.abs(b.vx); bounced=true; hitSides.push('left'); }
    else if(b.x + r > BOARD_PX){ b.x = BOARD_PX-r; b.vx = -Math.abs(b.vx); bounced=true; hitSides.push('right'); }
    if(b.y - r < 0){ b.y = r; b.vy = Math.abs(b.vy); bounced=true; hitSides.push('top'); }
    else if(b.y + r > BOARD_PX){ b.y = BOARD_PX-r; b.vy = -Math.abs(b.vy); bounced=true; hitSides.push('bottom'); }
    if(bounced){ registerBounce(b); onWallHit(b, hitSides); }
  });

  // ball-ball collisions
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a = balls[i], b = balls[j];
      if(a.eliminated||b.eliminated) continue;
      if(a.chewedBy || b.chewedBy) continue;
      if(a.eb_hidden || b.eb_hidden) continue;
      if((a.typeId==='uwoo' && a.uw_state==='dash') || (b.typeId==='uwoo' && b.uw_state==='dash')) continue;
      if(a.kt_chewing || b.kt_chewing) continue;
      if(a.oj_subscribeTargetUid===b.uid || b.oj_subscribeTargetUid===a.uid) continue;
      if((a.typeId==='hanbin' && a.hb_dashTargetUid===b.uid) || (b.typeId==='hanbin' && b.hb_dashTargetUid===a.uid)) continue;
      resolveBallCollision(a,b);
    }
  }

  // gloves (choiyeseong)
  balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='choiyeseong') return;
    const dist = unitToPx(9)/2 + unitToPx(owner.size)/2; // orbit radius from center
    const gloveR = unitToPx(GLOVE_SIZE)/2;
    [owner.cy_gloveAngle].forEach(angle=>{
      const gx = owner.x + Math.cos(angle)*dist;
      const gy = owner.y + Math.sin(angle)*dist;
      balls.forEach(target=>{
        if(target.uid===owner.uid || target.eliminated || target.chewedBy || isUntargetable(target) || isSameTeam(owner,target)) return;
        const cd = owner.cy_gloveCooldown[target.uid]||0;
        if(cd>0) return;
        const tr = unitToPx(target.size)/2;
        const dx = target.x-gx, dy = target.y-gy;
        const d = Math.hypot(dx,dy);
        if(d < gloveR+tr){
          owner.cy_gloveCooldown[target.uid] = 0.9;
          const dmg = bossScale(owner, 26);
          dealDamage(target, dmg, '글러브', owner);
          if(!target.eliminated){
            target.overrideSpeed = 40;
            target.bounceNeeded = 2;
            const nx = d===0?1:dx/d, ny=d===0?0:dy/d;
            target.vx = nx; target.vy = ny;
          }
          logEvent(`<b>${escName(owner)}</b>의 글러브가 <b>${escName(target)}</b>를(을) 강타! (${Math.round(dmg)} 대미지)`, owner.color);
        }
      });
    });
  });

  // frogs
  game.frogs.forEach(f=>{
    if(!f.alive) return;
    if(f.hitCooldown>0) f.hitCooldown -= dt;
    const fr = unitToPx(f.size)/2;
    const owner = balls.find(x=>x.uid===f.ownerUid);
    balls.forEach(target=>{
      if(target.eliminated || target.chewedBy || isUntargetable(target)) return;
      if(target.uid === f.ownerUid) return; // 김시후는 자신의 은빈이에게 피해를 입지 않음
      if(owner && isSameTeam(owner,target)) return;
      if(f.hitCooldown>0) return;
      const tr = unitToPx(target.size)/2;
      const dx = target.x-f.x, dy = target.y-f.y;
      const d = Math.hypot(dx,dy);
      if(d < fr+tr){
        dealDamage(target, bossScale(owner, 20), '은빈이', owner);
        f.hitCooldown = 0.5;
        const p = randomWallPoint(fr);
        f.x = p.x; f.y = p.y;
      }
    });
  });

  // uijoon: 좋아요 (like) swing hitboxes
  balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='uijoon' || owner.oj_likeTimeLeft<=0) return;
    const dist = unitToPx(8)/2 + unitToPx(owner.size)/2;
    const likeR = unitToPx(3)/2;
    [0, Math.PI*2/3, Math.PI*4/3].forEach(offset=>{
      const angle = owner.oj_likeAngle + offset;
      const lx = owner.x + Math.cos(angle)*dist;
      const ly = owner.y + Math.sin(angle)*dist;
      balls.forEach(target=>{
        if(target.uid===owner.uid || target.eliminated || target.chewedBy || isUntargetable(target) || isSameTeam(owner,target)) return;
        const cd = owner.oj_likeCooldown[target.uid]||0;
        if(cd>0) return;
        const tr = unitToPx(target.size)/2;
        const d = Math.hypot(target.x-lx, target.y-ly);
        if(d < likeR+tr){
          owner.oj_likeCooldown[target.uid] = 0.9;
          const dmg = bossScale(owner, 20);
          dealDamage(target, dmg, '좋아요', owner);
          logEvent(`<b>${escName(owner)}</b>의 좋아요가 <b>${escName(target)}</b>를(을) 강타! (${Math.round(dmg)} 대미지)`, owner.color);
        }
      });
    });
  });

  // 폭죽: 0.4초 경고 후 폭발, 범위 안의 상대에게 50 대미지
  for(let i=game.fireworks.length-1;i>=0;i--){
    const f = game.fireworks[i];
    const fo = balls.find(x=>x.uid===f.ownerUid);
    f.age += dt;
    if(!f.done && f.age>=f.delay){
      f.done = true;
      playSound('hit');
      const fr = unitToPx(24)/2;
      balls.forEach(t=>{
        if(t.eliminated || t.chewedBy || isUntargetable(t) || (fo && (t.uid===fo.uid || isSameTeam(fo,t)))) return;
        const tr = unitToPx(t.size)/2;
        if(Math.hypot(t.x-f.x,t.y-f.y) < fr+tr){
          dealDamage(t, bossScale(fo, 28), '폭죽', fo);
          logEvent(`<b>${escName(t)}</b>이 폭죽에 맞았다! (28 대미지)`, fo ? fo.color : '#b71c1c');
        }
      });
    }
    if(f.age >= f.delay+0.5) game.fireworks.splice(i,1);
  }

  // hyunseo: 다리털(- 모양) 이동/충돌
  for(let i=game.hairs.length-1;i>=0;i--){
    const h = game.hairs[i];
    const ho = balls.find(x=>x.uid===h.ownerUid);
    h.px = h.x; h.py = h.y;
    h.x += h.dx*15*SPEED_K*dt; h.y += h.dy*15*SPEED_K*dt;
    if(ho){
      balls.forEach(t=>{
        if(t.uid===ho.uid || t.eliminated || t.chewedBy || isUntargetable(t) || isSameTeam(ho,t) || h.hit.has(t.uid)) return;
        const tr = unitToPx(t.size)/2;
        if(segDist(t.x,t.y,h.px,h.py,h.x,h.y) < tr+6){
          h.hit.add(t.uid);
          dealDamage(t, bossScale(ho, 20), '다리털', ho);
          logEvent(`<b>${escName(ho)}</b>의 다리털이 <b>${escName(t)}</b>를(을) 맞혔다! (20 대미지)`, ho.color);
        }
      });
    }
    if(h.x<-40 || h.x>BOARD_PX+40 || h.y<-40 || h.y>BOARD_PX+40) game.hairs.splice(i,1);
  }

  // uwoo: 노래 공격 파동 (반지름 판 한 변의 1/2, 18 대미지)
  for(let i=game.waves.length-1;i>=0;i--){
    const w = game.waves[i];
    const wo = balls.find(x=>x.uid===w.ownerUid);
    w.radius += w.growSpeed*dt;
    balls.forEach(t=>{
      if(t.uid===w.ownerUid || t.eliminated || t.chewedBy || isUntargetable(t) || w.hitUids.has(t.uid)) return;
      if(wo && isSameTeam(wo,t)) return;
      const tr = unitToPx(t.size)/2;
      const d = Math.hypot(t.x-w.x, t.y-w.y);
      if(Math.abs(d-w.radius) < tr+8){
        w.hitUids.add(t.uid);
        dealDamage(t, bossScale(wo, 18), '노래', wo);
      }
    });
    if(w.radius > w.maxRadius) game.waves.splice(i,1);
  }

  // uwoo: 던진 공 이동/충돌 (0.2초 만에 벽까지 날아감)
  for(let i=game.uwBalls.length-1;i>=0;i--){
    const u = game.uwBalls[i];
    const uo = balls.find(x=>x.uid===u.ownerUid);
    if(!uo || uo.eliminated){ game.uwBalls.splice(i,1); continue; }
    if(u.stopped) continue;
    const ur = unitToPx(3)/2;
    u.px = u.x; u.py = u.y;
    u.t += dt;
    const k = Math.min(1, u.t/u.dur);
    u.x = u.x0 + (u.x1-u.x0)*k;
    u.y = u.y0 + (u.y1-u.y0)*k;
    if(k>=1){
      u.stopped = true;
      const or_ = unitToPx(uo.size)/2;
      uo.uw_state = 'dash';
      uo.uw_dashT = 0;
      uo.uw_sx = uo.x; uo.uw_sy = uo.y;
      uo.uw_tx = Math.max(or_, Math.min(BOARD_PX-or_, u.x));
      uo.uw_ty = Math.max(or_, Math.min(BOARD_PX-or_, u.y));
    }
  }

  // donghoo: 💪 이동/충돌
  for(let i=game.muscles.length-1;i>=0;i--){
    const m = game.muscles[i];
    const mo = balls.find(x=>x.uid===m.ownerUid);
    if(!mo || mo.eliminated){ game.muscles.splice(i,1); continue; }
    const mr = unitToPx(3)/2;
    // 운동 중: 💪은 사라져 있다가 3초 뒤 레벨 결과를 알려주고 다시 던져짐
    if(m.workout>0){
      m.workout -= dt;
      if(m.workout<=0){
        m.workout = 0;
        if(Math.random()<0.5){
          mo.dh_level += 1;
          logEvent(`<b>${escName(mo)}</b>: 운동 끝! 레벨이 올랐다! Lv.${mo.dh_level}`, mo.color);
        } else if(mo.dh_level>1){
          mo.dh_level -= 1;
          logEvent(`<b>${escName(mo)}</b>: 운동 끝... 레벨이 떨어졌다. Lv.${mo.dh_level}`, mo.color);
        } else {
          logEvent(`<b>${escName(mo)}</b>: 운동 끝... 레벨 변화 없음 (Lv.1 유지)`, mo.color);
        }
        m.x = mo.x; m.y = mo.y;
        const a1 = rand(0,Math.PI*2);
        m.vx = Math.cos(a1); m.vy = Math.sin(a1);
        m.pickCd = 2;
        m.hitCd = {};
      }
      continue;
    }
    m.rot = (m.rot||0) + dt*8;
    const spd = (10*mo.dh_level)*SPEED_K;
    m.x += m.vx*spd*dt; m.y += m.vy*spd*dt;
    if(m.x-mr<0){ m.x=mr; m.vx=Math.abs(m.vx); }
    else if(m.x+mr>BOARD_PX){ m.x=BOARD_PX-mr; m.vx=-Math.abs(m.vx); }
    if(m.y-mr<0){ m.y=mr; m.vy=Math.abs(m.vy); }
    else if(m.y+mr>BOARD_PX){ m.y=BOARD_PX-mr; m.vy=-Math.abs(m.vy); }
    for(const k in m.hitCd){ m.hitCd[k]-=dt; }
    if(m.pickCd>0) m.pickCd -= dt;
    balls.forEach(t=>{
      if(t.eliminated || t.chewedBy || t.eb_hidden) return;
      const tr = unitToPx(t.size)/2;
      if(Math.hypot(t.x-m.x,t.y-m.y) >= tr+mr) return;
      if(t.uid===mo.uid){
        if(m.pickCd>0 || mo.stunTimeLeft>0) return;
        m.workout = 3;
        mo.stunTimeLeft = 3;
        mo.stunAnchorX = mo.x; mo.stunAnchorY = mo.y;
        logEvent(`<b>${escName(mo)}</b>: "운동중..."`, mo.color);
        return;
      }
      if(isSameTeam(mo,t) || isUntargetable(t)) return;
      if((m.hitCd[t.uid]||0)>0) return;
      m.hitCd[t.uid] = 1.0;
      const dmg = bossScale(mo, 8*mo.dh_level);
      dealDamage(t, dmg, '💪', mo);
      logEvent(`<b>${escName(mo)}</b>의 💪가 <b>${escName(t)}</b>를(을) 강타! (${8*mo.dh_level} 대미지)`, mo.color);
    });
  }

  // eunbin: 수산시장 생선 이동/충돌
  for(let i=game.fishes.length-1;i>=0;i--){
    const f = game.fishes[i];
    const fo = balls.find(x=>x.uid===f.ownerUid);
    f.px = f.x; f.py = f.y;
    f.t += dt;
    const k = Math.min(1, f.t/f.dur);
    f.x = f.x0 + (f.x1-f.x0)*k;
    f.y = f.y0 + (f.y1-f.y0)*k;
    balls.forEach(target=>{
      if(target.eliminated || target.chewedBy || isUntargetable(target) || f.hit.has(target.uid)) return;
      if(target.uid===f.ownerUid) return;
      if(fo && isSameTeam(fo,target)) return;
      const tr = unitToPx(target.size)/2;
      if(segDist(target.x,target.y,f.px,f.py,f.x,f.y) < tr+42){
        f.hit.add(target.uid);
        dealDamage(target, bossScale(fo, 16), '생선', fo);
      }
    });
    if(f.t >= f.dur) game.fishes.splice(i,1);
  }

  // uijoon: 알림 설정 (expanding pulse)
  for(let i=game.pulses.length-1;i>=0;i--){
    const p = game.pulses[i];
    p.radius += p.growSpeed*dt;
    const pOwner = balls.find(x=>x.uid===p.ownerUid);
    balls.forEach(target=>{
      if(target.eliminated || target.chewedBy || isUntargetable(target) || p.hitUids.has(target.uid) || target.uid===p.ownerUid) return;
      if(pOwner && isSameTeam(pOwner,target)) return;
      const tr = unitToPx(target.size)/2;
      const d = Math.hypot(target.x-p.x, target.y-p.y);
      if(Math.abs(d - p.radius) < tr+8){
        p.hitUids.add(target.uid);
        dealDamage(target, bossScale(pOwner, 50), '알림 설정', pOwner);
        if(!target.eliminated){
          target.stunTimeLeft = 0.5;
          target.stunAnchorX = target.x; target.stunAnchorY = target.y;
        }
      }
    });
    if(p.radius > p.maxRadius) game.pulses.splice(i,1);
  }

  // hayul: 암산 공 충돌 체크
  for(let i=game.mathballs.length-1;i>=0;i--){
    const m = game.mathballs[i];
    const mr = unitToPx(m.size)/2;
    const mOwner = balls.find(x=>x.uid===m.ownerUid);
    let hit = false;
    balls.forEach(target=>{
      if(hit || target.eliminated || target.chewedBy || isUntargetable(target)) return;
      if(target.uid===m.ownerUid) return; // 전하율 본인은 자신의 문제에 맞지 않음 (회복 없음)
      if(mOwner && isSameTeam(mOwner,target)) return;
      const tr = unitToPx(target.size)/2;
      const d = Math.hypot(target.x-m.x, target.y-m.y);
      if(d >= mr+tr) return;
      const dmg = bossScale(mOwner, m.value);
      dealDamage(target, dmg, '암산', mOwner);
      logEvent(`<b>${escName(target)}</b>가 암산 문제(${m.text})에 맞아 ${Math.round(dmg)} 대미지!`, BALL_TYPE_MAP['siyoon'].color);
      hit = true;
    });
    if(hit) game.mathballs.splice(i,1);
  }

  // hanbin: 3점슛 농구공 이동/충돌
  for(let i=game.basketballs.length-1;i>=0;i--){
    const p = game.basketballs[i];
    const owner = balls.find(x=>x.uid===p.ownerUid);
    const target = balls.find(x=>x.uid===p.targetUid);
    if(!owner || owner.eliminated || !target || target.eliminated){
      if(owner) owner.hb_busy = false;
      game.basketballs.splice(i,1);
      continue;    }
    p.catchupTimer += dt;
    if(p.catchupTimer>=1){
      p.catchupTimer -= 1;
      if(target.speedStat > p.speedStat) p.speedStat += 1;
    }
    p.x += p.vx * p.speedStat * SPEED_K * dt;
    p.y += p.vy * p.speedStat * SPEED_K * dt;

    const pr = unitToPx(3)/2, tr = unitToPx(target.size)/2;
    const d = Math.hypot(target.x-p.x, target.y-p.y);
    const outOfBounds = p.x<-40 || p.x>BOARD_PX+40 || p.y<-40 || p.y>BOARD_PX+40;
    if(d < pr+tr){
      if(Math.random() < 0.75){
        const dmg = bossScale(owner, 50);
        dealDamage(target, dmg, '3점슛', owner);
        applyDebuff(target, 0, -1, 5);
        logEvent(`<b>${escName(target)}</b>의 기세가 하락!`, owner.color);
      } else {
        applyDebuff(owner, 0, -1, 5);
        logEvent(`<b>${escName(owner)}</b>의 기세가 하락!`, owner.color);
      }
      owner.hb_busy = false;
      game.basketballs.splice(i,1);
    } else if(outOfBounds){
      applyDebuff(owner, 0, -1, 5);
      logEvent(`<b>${escName(owner)}</b>의 기세가 하락!`, owner.color);
      owner.hb_busy = false;
      game.basketballs.splice(i,1);
    }
  }

  // kwontaemin: check thin-mode chew trigger separately (already partly handled in collision resolve)
}

function escName(b){ return b.name; }

function registerBounce(b){
  if(b.bounceNeeded>0){
    b.bounceNeeded -= 1;
    if(b.bounceNeeded<=0){
      b.overrideSpeed = null;
      b.statusTag = null;
    }
  }
}

function isAnchored(b){
  return (b.typeId==='dongju' && b.dj_state==='anxious') || b.stunTimeLeft>0 || b.hs_pauseTimer>0 || (b.typeId==='eunbin' && b.eb_intro>0) || b.typeId==='uwoo';
}

function resolveBallCollision(a,b){
  const ra = unitToPx(a.size)/2, rb = unitToPx(b.size)/2;
  const dx = b.x-a.x, dy = b.y-a.y;
  let dist = Math.hypot(dx,dy);
  const minDist = ra+rb;
  if(dist >= minDist) return;
  if(dist===0){ dist=0.01; }
  const nx = dx/dist, ny = dy/dist;

  const aAnchored = isAnchored(a), bAnchored = isAnchored(b);
  const sizeMismatch = Math.max(ra,rb) > Math.min(ra,rb)*1.4;
  if(aAnchored || bAnchored || sizeMismatch){
    // 정지 상태이거나 크기 차이가 큰 경우: 작은/움직이는 쪽을 완전히 튕겨내서 붙어 도는 현상을 방지
    let anchor, mover;
    if(aAnchored || bAnchored){
      anchor = aAnchored ? a : b;
      mover = aAnchored ? b : a;
    } else {
      anchor = ra>=rb ? a : b;
      mover = anchor===a ? b : a;
    }
    const isTrueAnchor = (anchor===a?aAnchored:bAnchored);
    const ar = unitToPx(anchor.size)/2, mr = unitToPx(mover.size)/2;
    const mnx = (mover===b) ? nx : -nx, mny = (mover===b) ? ny : -ny;
    mover.x = anchor.x + mnx*(ar+mr+2);
    mover.y = anchor.y + mny*(ar+mr+2);
    { const mr2 = unitToPx(mover.size)/2; mover.x = Math.max(mr2, Math.min(BOARD_PX-mr2, mover.x)); mover.y = Math.max(mr2, Math.min(BOARD_PX-mr2, mover.y)); }
    mover.vx = mnx; mover.vy = mny;
    registerBounce(mover);
    if(!isTrueAnchor){
      anchor.vx = -mnx; anchor.vy = -mny;
      registerBounce(anchor);
    }
  } else {
    // separate overlap with a small extra margin so they don't immediately re-touch next frame
    const overlap = (minDist-dist)/2 + 1;
    a.x -= nx*overlap; a.y -= ny*overlap;
    b.x += nx*overlap; b.y += ny*overlap;

    // reflect velocities along normal (equal-mass elastic swap of normal component)
    const va = a.vx*nx + a.vy*ny;
    const vb = b.vx*nx + b.vy*ny;
    a.vx += (vb-va)*nx; a.vy += (vb-va)*ny;
    b.vx += (va-vb)*nx; b.vy += (va-vb)*ny;
    normalizeVel(a); normalizeVel(b);

    registerBounce(a);
    registerBounce(b);
  }
  playSound('bounce');

  // HP가 낮은 쪽의 접촉 스킬이 먼저 적용되도록 순서 결정
  const first = a.hp<=b.hp ? a : b;
  const second = first===a ? b : a;

  // ---- kwontaemin special interactions ----
  handleKwontaeminCollision(first, second);
  handleKwontaeminCollision(second, first);

  // ---- shinyechan hacking / virus (신예찬과 직접 부딪힐 때만 중첩) ----
  handleVirusCollision(first, second);
  handleVirusCollision(second, first);

  // ---- dongju rampage ----
  handleDongjuCollision(first, second);
  handleDongjuCollision(second, first);

  // ---- hyunseo 다리털 뽑기 ----
  handleHyunseoCollision(first, second);
  handleHyunseoCollision(second, first);

  // ---- 전하율 대회전 충돌 ----
  handleSpikeCollision(first, second);
  handleSpikeCollision(second, first);

  // ---- 이은총 F1 ----
  handleF1Collision(first, second);
  handleF1Collision(second, first);

  // ---- 노하민 할리우드 액션 ----
  handleHollywoodCollision(first, second);
  handleHollywoodCollision(second, first);

  // ---- hayul 가시 ----
}

function handleHyunseoCollision(hs, other){
  if(isUntargetable(other)) return;
  if(hs.typeId!=='hyunseo' || hs.hs_pauseTimer>0) return;
  if(hs.eliminated || other.eliminated) return;
  if((hs.hs_hitCooldown[other.uid]||0)>0) return;
  hs.hs_hitCooldown[other.uid] = 1.5;
  dealDamage(other, bossScale(hs, 10), '다리털', hs);
  logEvent(`<b>${escName(hs)}</b>: "다리털을 뽑음!" (<b>${escName(other)}</b> 10 대미지)`, hs.color);
  if(!other.eliminated){
    // 살짝 밀려나고 1초 정지
    const dx = other.x-hs.x, dy = other.y-hs.y;
    const d = Math.hypot(dx,dy) || 1;
    const orad = unitToPx(other.size)/2;
    other.x = Math.max(orad, Math.min(BOARD_PX-orad, other.x + dx/d*18));
    other.y = Math.max(orad, Math.min(BOARD_PX-orad, other.y + dy/d*18));
    other.stunTimeLeft = Math.max(other.stunTimeLeft, 1);
    other.stunAnchorX = other.x; other.stunAnchorY = other.y;
  }
  hs.hs_pulls = (hs.hs_pulls||0) + 1;
  if(hs.hs_pulls>=4){
    hs.hs_pulls = 0;
    hs.hs_pauseTimer = 1;
    hs.hs_anchorX = hs.x; hs.hs_anchorY = hs.y;
    logEvent(`<b>${escName(hs)}</b>: 다리털을 4번 뽑았다! 잠시 멈춥니다...`, hs.color);
  }
}

function infectStack(target, source){
  if(target.eliminated) return;
  if(isUntargetable(target)) return;
  if(target.typeId==='shinyechan') return; // 신예찬은 바이러스에 걸리지 않음
  if(target.virusInfectCooldown>0) return; // 한 번 부딪히면 한 번만 감염(연속 접촉 스팸 방지)
  if(tryDodge(target)) return;
  target.virusStacks += 1;
  if(source) target.virusSourceUid = source.uid;
  target.virusInfectCooldown = 1.0;
  if(source && source.isBoss) target.virusDmgMult = source.dmgMult!==undefined ? source.dmgMult : 1;
}

function handleVirusCollision(source, other){
  if(source.eliminated || other.eliminated) return;
  if(source.typeId!=='shinyechan') return; // 신예찬 본인과 부딪힐 때만 감염/중첩
  if(isSameTeam(source, other)) return; // 같은 팀은 감염시키지 않음
  const before = other.virusStacks;
  infectStack(other, source);
  if(other.virusStacks > before){
    logEvent(`<b>${escName(source)}</b>가 해킹을 시도! <b>${escName(other)}</b> 바이러스 감염! (중첩 ${other.virusStacks})`, source.color);
  }
}

function handleDongjuCollision(dj, other){
  if(isUntargetable(other)) return;
  if(dj.typeId!=='dongju' || dj.dj_state!=='active') return;
  if(dj.eliminated || other.eliminated) return;
  if(isSameTeam(dj, other)) return;
  const cd = dj.dj_hitCooldown[other.uid]||0;
  if(cd>0) return;
  dj.dj_hitCooldown[other.uid] = 0.5;
  const dmg = bossScale(dj, 55);
  dealDamage(other, dmg, '동주', dj);
  logEvent(`<b>${escName(dj)}</b>의 몸통박치기! <b>${escName(other)}</b> ${Math.round(dmg)} 대미지!`, dj.color);
  if(other.eliminated){
    dj.dj_state = 'anxious';
    dj.dj_timer = 0;
    dj.dj_anchorX = dj.x; dj.dj_anchorY = dj.y;
  }
}

function normalizeVel(b){
  const m = Math.hypot(b.vx,b.vy);
  if(m>0){ b.vx/=m; b.vy/=m; }
}

function handleKwontaeminCollision(kt, other){
  if(isUntargetable(other)) return;
  if(kt.eliminated || other.eliminated) return;
  if(kt.typeId!=='kwontaemin') return;
  if(kt.chewedBy) return;
  if(kt.kt_chewing) return; // 한 번에 한 명만 씹음 - 이미 씹는 중이면 무시
  if(isSameTeam(kt, other)) return; // 같은 팀끼리는 서로 영향 없음

  if(kt.kt_mode==='fat'){
    if(kt.kt_hitImmuneTimer>0) return; // 살찐 상태 복귀 직후 1초 grace period
    const hitCd = kt.kt_hitCooldownMap[other.uid]||0;
    if(hitCd>0) return; // 같은 상대와 계속 겹쳐있어도 한 번의 부딪힘만 카운트
    kt.kt_hitCooldownMap[other.uid] = 0.4;
    kt.kt_hitCount += 1;
    if(kt.kt_hitCount >= 4){
      kt.kt_mode = 'thin';
      kt.kt_hitCount = 0;
      kt.size = 6*(kt.sizeMult||1); kt.speedStat = 6;
      logEvent(`<b>${escName(kt)} 다이어트 성공!</b> 살을 뺀 ${escName(kt)}(으)로 변신!`, kt.color);
    }
  } else if(kt.kt_mode==='thin'){
    if(kt.kt_cooldown>0) return;
    if(other.chewedBy) return;
    if(tryDodge(other)){ kt.kt_cooldown = 0.3; return; }
    // start chewing - 태민은 멈춰서 부들부들 떨림
    kt.kt_cooldown = 0.2;
    kt.kt_chewing = true;
    kt.kt_chewAnchorX = kt.x; kt.kt_chewAnchorY = kt.y;
    other.chewedBy = kt.uid;
    other.chewTimeLeft = 3;
    other.overrideSpeed = 0;
    logEvent(`<b>${escName(kt)}</b>가 <b>${escName(other)}</b>를(을) 씹어먹기 시작!`, kt.color);
  }
}

function finishChew(attacker, target){
  target.chewedBy = null;
  target.overrideSpeed = 50;
  target.bounceNeeded = 3;

  // 뱉는 방향으로 서로의 반지름+여유 거리만큼 떨어뜨려서 즉시 재충돌(반복 포식)되지 않도록 함
  const ar = unitToPx(attacker.size)/2, tr = unitToPx(target.size)/2;
  const gap = (ar+tr) * 1.3 + 10;
  let ang = rand(0,Math.PI*2);
  let tvx = Math.cos(ang), tvy = Math.sin(ang);
  let tx = attacker.x + tvx*gap;
  let ty = attacker.y + tvy*gap;
  // 벽/구석 근처라 클램프로 간격이 줄어들 상황이면 보드 중심 쪽으로 방향을 다시 잡음
  if(tx < tr || tx > BOARD_PX-tr || ty < tr || ty > BOARD_PX-tr){
    const cang = Math.atan2(BOARD_PX/2-attacker.y, BOARD_PX/2-attacker.x) + rand(-0.6,0.6);
    tvx = Math.cos(cang); tvy = Math.sin(cang);
    tx = attacker.x + tvx*gap;
    ty = attacker.y + tvy*gap;
  }
  target.vx = tvx; target.vy = tvy;
  target.x = Math.max(tr, Math.min(BOARD_PX-tr, tx));
  target.y = Math.max(tr, Math.min(BOARD_PX-tr, ty));
  logEvent(`<b>${escName(attacker)}</b>가 <b>${escName(target)}</b>를(을) 멀리 뱉어버림! (체력 10 회복)`, attacker.color);

  attacker.kt_hitCooldownMap[target.uid] = 1.0; // 뱉은 직후 바로 다시 카운트/포식되지 않도록 여유
  attacker.hp = Math.min(attacker.maxHp, attacker.hp + 10);
  attacker.kt_mode = 'fat';
  attacker.kt_hitCount = 0;
  attacker.kt_chewing = false;
  attacker.kt_hitImmuneTimer = 1.0;
  attacker.size = attacker.baseSize;
  attacker.speedStat = attacker.baseSpeed;

  if(target.hp<=0){ eliminate(target, attacker); }
}

// 오의준 회피 능력은 삭제됨 (항상 false)
function tryDodge(target){
  return false;
}

// 살찐 권태민은 받는 대미지 50% 감소
function reduceIfFatKwontaemin(target, amount){
  if(target.typeId==='kwontaemin' && target.kt_mode==='fat'){
    return amount*0.5;
  }
  return amount;
}

// 같은 팀(빨강/파랑, 보스/도전자)끼리는 서로 대미지를 주지 않음
function isSameTeam(a,b){
  if(!a || !b) return false;
  if(a.team===null || a.team===undefined || b.team===null || b.team===undefined) return false;
  return a.team===b.team;
}

// 보스 전용 대미지 배율 적용 (source가 보스일 때만 배율 적용)
function bossScale(source, baseAmount){
  const buff = (source && source.atkBuffTimer>0) ? 2 : 1;
  if(source && source.isBoss){
    return baseAmount * (source.dmgMult!==undefined ? source.dmgMult : 1) * buff;
  }
  return baseAmount * buff;
}

function isUntargetable(b){
  return !!b.eb_hidden; // 박은빈이 숨었거나, 레드카드로 퇴장 중
}

function wallPointOnSide(side, radius){
  const pad = radius+3;
  if(side==='left') return {x:pad, y:rand(pad,BOARD_PX-pad), base:0};
  if(side==='right') return {x:BOARD_PX-pad, y:rand(pad,BOARD_PX-pad), base:Math.PI};
  if(side==='top') return {x:rand(pad,BOARD_PX-pad), y:pad, base:Math.PI/2};
  return {x:rand(pad,BOARD_PX-pad), y:BOARD_PX-pad, base:-Math.PI/2};
}

// 벽에 부딪힌 공 처리: 박은빈은 사라지고, 다른 공이 부딪히면 숨은 박은빈이 그 벽에서 다시 나타남
function returnFromExpel(b){
  const r = unitToPx(b.size)/2;
  let p;
  if(b.typeId==='uwoo'){ p = randomWallPoint(r); p.x = Math.max(r,Math.min(BOARD_PX-r,p.x)); p.y = Math.max(r,Math.min(BOARD_PX-r,p.y)); }
  else {
    const placed = game.balls.filter(x=>x.uid!==b.uid && !x.eliminated && !x.eb_hidden).map(x=>({x:x.x,y:x.y,r:unitToPx(x.size)/2}));
    p = pickSpawnPosition(r, placed);
  }
  b.x = p.x; b.y = p.y;
  const a = rand(0,Math.PI*2);
  b.vx = Math.cos(a); b.vy = Math.sin(a);
  b.stunTimeLeft = 0; b.overrideSpeed = null;
  b.eb_hidden = false; b.expelTimer = 0;
  logEvent(`<b>${escName(b)}</b>이 퇴장에서 복귀했습니다.`, b.color);
}

function handleHollywoodCollision(nh, other){
  if(nh.typeId!=='nohamin') return;
  if(nh.eliminated || other.eliminated || other.chewedBy || isUntargetable(other) || isUntargetable(nh) || isSameTeam(nh,other)) return;
  if((nh.nh_hitCd[other.uid]||0)>0) return;
  if(nh.nh_cd>0) return; // 스킬 쿨타임 5초
  nh.nh_hitCd[other.uid] = 1.0;
  // 작용반작용: 상대 반대 방향으로 빠르게 밀려남
  const dx = nh.x-other.x, dy = nh.y-other.y, d = Math.hypot(dx,dy) || 1;
  nh.vx = dx/d; nh.vy = dy/d;
  // 최예성 글러브에 맞은 것처럼 속도 40으로 날아가고, 벽/상대에 2번 부딪히면 원래 속도로 복귀
  nh.overrideSpeed = 40;
  nh.bounceNeeded = 2;
  nh.nh_cd = 5;
  logEvent(`<b>${escName(nh)}</b>: "할리우드 액션"! <b>${escName(other)}</b>에게 옐로카드! (22 대미지)`, nh.color);
  dealDamage(other, bossScale(nh, 22), '옐로카드', nh);
  if(other.eliminated) return;
  other.yellowCards = (other.yellowCards||0) + 1;
  if(other.yellowCards>=2){
    other.yellowCards = 0;
    other.eb_hidden = true;
    other.expelTimer = 4;
    other.expelSourceUid = nh.uid;
    other.stunTimeLeft = 0;
    logEvent(`<b>${escName(nh)}</b>: "레드카드! 퇴장!" — <b>${escName(other)}</b> 4초간 제외`, nh.color);
  }
}

function handleF1Collision(e, other){
  if(e.typeId!=='eunchong' || e.f1_state!=='active') return;
  if(e.eliminated || other.eliminated || other.chewedBy || isUntargetable(other) || isSameTeam(e,other)) return;
  if((e.f1_hitCd[other.uid]||0)>0) return;
  e.f1_hitCd[other.uid] = 1.0;
  dealDamage(other, bossScale(e, 42), 'F1', e);
  logEvent(`<b>${escName(e)}</b>의 F1이 <b>${escName(other)}</b>를(을) 들이받았다! (42 대미지, 자신도 8)`, e.color);
  dealDamage(e, 8, 'F1 반동');
  if(other.eliminated || isAnchored(other) || other.typeId==='uwoo') return;
  const dx = other.x-e.x, dy = other.y-e.y, d = Math.hypot(dx,dy) || 1;
  other.vx = dx/d; other.vy = dy/d;
  other.overrideSpeed = 25;
  other.bounceNeeded = 0;
  other.flyUntilWall = true; // 벽에 부딪힐 때까지 속도 25
}

function hayulStartQ(b){
  b.hl_state = 'dash';
  b.hl_next = 'W';
  b.hl_dashT = 0;
  const cands = game.balls.filter(x=>x.uid!==b.uid && !x.eliminated && !x.chewedBy && !isUntargetable(x) && !isSameTeam(b,x));
  b.hl_targetUid = null;
  let a;
  if(cands.length>0){
    const tg = choice(cands);
    b.hl_targetUid = tg.uid;
    a = Math.atan2(tg.y-b.y, tg.x-b.x);
  } else { a = rand(0,Math.PI*2); }
  b.vx = Math.cos(a); b.vy = Math.sin(a);
  b.overrideSpeed = 20;
  logEvent(`<b>${escName(b)}</b>: "대회전(Q)"`, b.color);
}
function hayulStartW(b){
  b.hl_state = 'spike';
  b.hl_timer = 3;
  b.hl_next = 'Q';
  logEvent(`<b>${escName(b)}</b>: "몸 말아 웅크리기(W)"`, b.color);
}
function handleSpikeCollision(hy, other){
  if(hy.typeId!=='hayul' || hy.hl_state!=='dash') return;
  if(hy.eliminated || other.eliminated || isUntargetable(other)) return;
  if((hy.hl_hitCd[other.uid]||0)>0) return;
  hy.hl_hitCd[other.uid] = 0.5;
  dealDamage(other, bossScale(hy, 10), '대회전', hy);
  logEvent(`<b>${escName(hy)}</b>의 대회전이 <b>${escName(other)}</b>를(을) 들이받았다! (10 대미지)`, hy.color);
}

function onWallHit(b, sides){
  if(b.flyUntilWall){ b.flyUntilWall = false; b.overrideSpeed = null; } // F1에 맞아 날아가던 중 벽에 닿으면 종료
  if(b.typeId==='hayul' && b.hl_state==='dash'){
    // 벽에 닿으면 돌진 끝, 이후 3초 쿨타임
    b.hl_state = 'wait';
    b.hl_timer = 3;
    b.overrideSpeed = null;
    return;
  }
  if(b.typeId==='eunbin'){
    if(!b.eb_hidden && b.eb_graceTimer<=0){
      b.eb_wallHits = (b.eb_wallHits||0) + 1;
      if(b.eb_wallHits < 4) return;
      b.eb_wallHits = 0;
      b.eb_hidden = true;
      b.eb_hiddenTimer = 3;
      logEvent(`<b>${escName(b)}</b>: "사라졌다!"`, b.color);
    }
  }
}

// 사라진 지 3초 뒤 랜덤 위치에서 "찾았다"와 함께 나타나며 생선 2마리 발사
function revealEunbin(e){
  const er = unitToPx(e.size)/2;
  const placed = game.balls.filter(x=>x.uid!==e.uid && !x.eliminated && !x.eb_hidden).map(x=>({x:x.x,y:x.y,r:unitToPx(x.size)/2}));
  const p = pickSpawnPosition(er+30, placed);
  e.x = p.x; e.y = p.y;
  const ang = rand(0,Math.PI*2);
  e.vx = Math.cos(ang); e.vy = Math.sin(ang);
  e.eb_hidden = false;
  e.eb_graceTimer = 0.8;
  logEvent(`<b>${escName(e)}</b>: "찾았다" — 수산시장!`, e.color);
  for(let i=0;i<4;i++) spawnFish(e);
}

function uwWallDist(x,y,ang){
  const m = unitToPx(3)/2;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let tt = Infinity;
  if(dx>1e-6) tt = Math.min(tt, (BOARD_PX-m-x)/dx); else if(dx<-1e-6) tt = Math.min(tt, (m-x)/dx);
  if(dy>1e-6) tt = Math.min(tt, (BOARD_PX-m-y)/dy); else if(dy<-1e-6) tt = Math.min(tt, (m-y)/dy);
  return Math.max(tt, 10);
}

function spawnFish(owner){
  // 정사각형 판의 테두리에서 시작해 반대편 테두리(중심 기준 점대칭)에서 끝남
  const side = randInt(0,3);
  let x0, y0;
  if(side===0){ x0=rand(0,BOARD_PX); y0=0; }
  else if(side===1){ x0=rand(0,BOARD_PX); y0=BOARD_PX; }
  else if(side===2){ x0=0; y0=rand(0,BOARD_PX); }
  else { x0=BOARD_PX; y0=rand(0,BOARD_PX); }
  game.fishes.push({
    uid: nextUid(), ownerUid: owner.uid,
    x0, y0, x1: BOARD_PX-x0, y1: BOARD_PX-y0,
    px:x0, py:y0, x:x0, y:y0, t:0, dur:0.8, hit:new Set()
  });
}

function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const l2 = dx*dx+dy*dy;
  let t = l2===0 ? 0 : ((px-ax)*dx+(py-ay)*dy)/l2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

function updateBossOverlay(){
  const el = document.getElementById('fireworkText');
  if(!el) return;
  el.style.display = (game && game.blackout) ? 'block' : 'none';
}

function updateIntroOverlay(){
  const el = document.getElementById('introOverlay');
  if(!el) return;
  if(!game || !game.hasIntro || game.elapsed>=4){ el.style.opacity=0; el.style.display='none'; return; }
  el.style.display='flex';
  el.style.opacity = game.elapsed<3 ? 1 : Math.max(0, 1-(game.elapsed-3));
}

function addStats(target, source, amt){
  amt = Math.max(0, amt);
  if(target) target.dmgTaken = (target.dmgTaken||0) + amt;
  if(source && source!==target) source.dmgDealt = (source.dmgDealt||0) + amt;
}

let reflectingNow = false;
function dealDamage(target, amount, sourceName, source){
  if(target.eliminated) return;
  if(isUntargetable(target)) return;
  if(source && isSameTeam(source, target)) return; // 같은 팀은 서로 공격 불가
  if(tryDodge(target)) return;
  // 몸 말아 웅크리기(W) 중인 전하율: 받는 대미지 50% 감소, 감소된 50%는 공격한 상대에게 반사
  let reflect = 0;
  if(target.typeId==='hayul' && target.hl_state==='spike' && source && source!==target && !reflectingNow){
    reflect = amount*0.5;
    amount = amount*0.5;
  }
  amount = reduceIfFatKwontaemin(target, amount);
  addStats(target, source, Math.min(amount, Math.max(0,target.hp)));
  target.hp -= amount;
  if(target.hp<=0){ target.hp=0; eliminate(target, source); }
  if(reflect>0 && !source.eliminated){
    reflectingNow = true;
    dealDamage(source, reflect, '반사', target);
    reflectingNow = false;
    logEvent(`<b>${escName(target)}</b>의 방어막이 대미지 ${Math.round(reflect)}를 <b>${escName(source)}</b>에게 반사!`, target.color);
  }
}

function eliminate(b, killer){
  if(b.eliminated) return;
  b.eliminated = true;
  if(killer && killer!==b) killer.kills = (killer.kills||0) + 1;
  if(game){ game.elimCounter = (game.elimCounter||0) + 1; b.elimOrder = game.elimCounter; b.elimTime = game.elapsed; }
  playSound('eliminate');
  logEvent(`<span style="color:${b.color}">${escName(b)}</span> <b style="color:#141416">탈락!</b>`, '#141416');
}

// 기세 하락 등 임시 크기/속도 디버프 (중첩 없이 지속시간만 갱신)
function applyDebuff(target, sizeDelta, speedDelta, duration){
  if(target.eliminated) return;
  if(target.debuffTimeLeft>0){
    target.debuffTimeLeft = duration;
    return;
  }
  target.size = Math.max(1, target.size+sizeDelta);
  target.speedStat = Math.max(0.5, target.speedStat+speedDelta);
  target.debuffTimeLeft = duration;
  target.debuffRevert = {sizeDelta, speedDelta};
}

/* ============================================================
   WIN CONDITION
============================================================ */
function checkWinCondition(){
  if(game.finished) return;
  const alive = game.balls.filter(b=>!b.eliminated);

  if(game.mode==='team'){
    const teamsAlive = new Set(alive.map(b=>b.team));
    if(teamsAlive.size <= 1){
      finishGame(alive);
    }
  } else if(game.mode==='boss'){
    const teamsAlive = new Set(alive.map(b=>b.team));
    if(teamsAlive.size <= 1){
      finishGame(alive);
    }
  } else {
    if(alive.length <= 1){
      finishGame(alive);
    }
  }
}

let recordData = [];
let recordTab = 'dealt';
function buildRecord(){
  const balls = game.balls;
  const aliveBalls = balls.filter(b=>!b.eliminated);
  const elim = balls.filter(b=>b.eliminated).sort((a,b)=>(b.elimOrder||0)-(a.elimOrder||0));
  const rows = [];
  aliveBalls.forEach(b=>rows.push({b, rank:1}));
  elim.forEach((b,i)=>rows.push({b, rank:aliveBalls.length+i+1}));
  recordData = rows.map(r=>({
    name:r.b.name, color:r.b.color, rank:r.rank,
    dealt:Math.round(r.b.dmgDealt||0), kills:(r.b.kills||0),
    alive:!r.b.eliminated, time:r.b.eliminated ? r.b.elimTime : null
  }));
}
function renderRecord(){
  const body = document.getElementById('recordBody');
  document.querySelectorAll('.record-tab').forEach(t=>t.classList.toggle('active', t.dataset.rtab===recordTab));
  let html = '';
  if(recordTab==='rank'){
    const rows = [...recordData].sort((a,b)=>a.rank-b.rank);
    rows.forEach(r=>{
      html += `<div class="record-rank"><span class="rnum">${r.rank}위</span><span style="color:${r.color};font-weight:700">${r.name}</span><span class="rsub">${r.alive ? '생존' : fmtTime(r.time||0)+' 탈락'}</span></div>`;
    });
  } else {
    const key = recordTab;
    const rows = [...recordData].sort((a,b)=>b[key]-a[key] || a.rank-b.rank);
    const mx = Math.max(1, ...rows.map(r=>r[key]));
    rows.forEach(r=>{
      html += `<div class="record-row"><div class="rline"><span class="rname" style="color:${r.color}">${r.name}</span><span>${r[key]}</span></div><div class="rbar"><div class="rfill" style="width:${r[key]/mx*100}%;background:${r.color}"></div></div></div>`;
    });
  }
  body.innerHTML = html || '<div style="color:#888;font-size:13px">기록이 없습니다.</div>';
}
document.getElementById('btnRecord').addEventListener('click', ()=>{
  recordTab = 'dealt'; renderRecord();
  document.getElementById('recordModal').classList.add('open');
});
document.getElementById('btnRecordClose').addEventListener('click', ()=>document.getElementById('recordModal').classList.remove('open'));
document.getElementById('recordModal').addEventListener('click', (e)=>{ if(e.target.id==='recordModal') e.target.classList.remove('open'); });
document.querySelectorAll('.record-tab').forEach(t=>t.addEventListener('click', ()=>{ recordTab = t.dataset.rtab; renderRecord(); }));

function finishGame(alive){
  game.finished = true;
  buildRecord();
  playSound('win');
  stopGameLoop();
  setTimeout(()=>{
    const winnerEl = document.getElementById('resultWinner');
    const subEl = document.getElementById('resultSub');
    if(alive.length===0){
      winnerEl.innerHTML = '무승부';
      subEl.textContent = '아무도 살아남지 못했습니다.';
    } else if(game.mode==='team'){
      const team = alive[0].team;
      const teamName = team==='red' ? '빨강팀' : '파랑팀';
      const names = alive.map(b=>b.name).join(', ');
      winnerEl.innerHTML = `승자 : <span class="wname">${teamName}</span>`;
      subEl.textContent = names + ' 생존';
    } else if(game.mode==='boss'){
      if(alive[0].team==='boss'){
        winnerEl.innerHTML = `승자 : <span class="wname">${alive[0].name}</span>`;
        subEl.textContent = '보스가 모든 도전자를 물리쳤습니다!';
      } else {
        const names = alive.map(b=>b.name).join(', ');
        winnerEl.innerHTML = `승자 : <span class="wname">도전자 팀</span>`;
        subEl.textContent = names + ' 생존 — 보스 처치 성공!';
      }
    } else {
      winnerEl.innerHTML = `승자 : <span class="wname">${alive[0].name}</span>`;
      subEl.textContent = '경기 시간 ' + fmtTime(game.elapsed);
    }
    showScreen('screen-result');
  }, 700);
}

/* ============================================================
   RENDER
============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function render(){
  ctx.clearRect(0,0,BOARD_PX,BOARD_PX);
  if(game.blackout){ ctx.fillStyle = '#000'; ctx.fillRect(0,0,BOARD_PX,BOARD_PX); }
  // 폭죽 경고/폭발
  game.fireworks.forEach((f,idx)=>{
    const fr = unitToPx(24)/2;
    if(f.age < f.delay){
      ctx.beginPath(); ctx.arc(f.x,f.y,fr,0,Math.PI*2);
      ctx.setLineDash([6,5]); ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,90,60,'+(0.5+0.4*Math.sin(f.age*30)).toFixed(2)+')'; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(f.x,f.y,4,0,Math.PI*2); ctx.fillStyle='#ffd54f'; ctx.fill();
    } else {
      const k = Math.min(1,(f.age-f.delay)/0.5);
      ctx.beginPath(); ctx.arc(f.x,f.y,fr,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,190,60,'+(0.55*(1-k)).toFixed(3)+')'; ctx.fill();
      const cols=['#ff5252','#ffd54f','#69f0ae','#40c4ff','#e040fb'];
      for(let s=0;s<14;s++){
        const a = s/14*Math.PI*2 + idx;
        const r1 = fr*(0.25+0.75*k), r2 = r1 + 10;
        ctx.beginPath(); ctx.moveTo(f.x+Math.cos(a)*r1, f.y+Math.sin(a)*r1); ctx.lineTo(f.x+Math.cos(a)*r2, f.y+Math.sin(a)*r2);
        ctx.strokeStyle = cols[s%cols.length]; ctx.globalAlpha = 1-k; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
  });

  // frogs
  game.frogs.forEach(f=>{
    if(!f.alive) return;
    const r = unitToPx(f.size)/2;
    ctx.font = (r*2.2)+'px serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('🐸', f.x, f.y+1);
  });

  // gippeum 마사지 바운더리 (빨간 빗금)
  game.balls.forEach(b=>{
    if(b.eliminated || b.typeId!=='gippeum' || b.kj_state==='cool') return;
    const zr = unitToPx(12)/2 * (b.sizeMult||1);
    ctx.save();
    ctx.beginPath(); ctx.arc(b.x,b.y,zr,0,Math.PI*2); ctx.clip();
    ctx.fillStyle='rgba(224,38,63,0.10)'; ctx.fillRect(b.x-zr,b.y-zr,zr*2,zr*2);
    ctx.strokeStyle='rgba(224,38,63,0.55)'; ctx.lineWidth=2;
    for(let o=-zr*2;o<=zr*2;o+=9){
      ctx.beginPath(); ctx.moveTo(b.x-zr+o, b.y+zr); ctx.lineTo(b.x+zr+o, b.y-zr); ctx.stroke();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(b.x,b.y,zr,0,Math.PI*2);
    ctx.strokeStyle='#e0263f'; ctx.lineWidth=3; ctx.stroke();
  });

  // eunbin fish
  game.fishes.forEach(f=>{
    ctx.beginPath();
    ctx.moveTo(f.x0,f.y0); ctx.lineTo(f.x1,f.y1);
    ctx.strokeStyle='rgba(0,166,199,0.25)'; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    const fdx=f.x1-f.x0, fdy=f.y1-f.y0, fang=Math.atan2(fdy,fdx);
    ctx.save();
    ctx.translate(f.x,f.y);
    if(fdx>=0){ ctx.rotate(fang); ctx.scale(-1,1); } else { ctx.rotate(fang+Math.PI); }
    ctx.font='84px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🐟', 0, 0);
    ctx.restore();
  });

  // hyunseo hairs (- 모양)
  game.hairs.forEach(h=>{
    ctx.beginPath();
    ctx.moveTo(h.x-h.dx*13, h.y-h.dy*13);
    ctx.lineTo(h.x+h.dx*13, h.y+h.dy*13);
    ctx.lineCap = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#3a2a1a'; ctx.stroke();
    ctx.lineCap = 'butt';
  });

  // uwoo song waves
  game.waves.forEach(w=>{
    ctx.beginPath();
    ctx.arc(w.x,w.y,Math.max(0,w.radius),0,Math.PI*2);
    ctx.strokeStyle = w.color; ctx.lineWidth = 4; ctx.globalAlpha = 0.65; ctx.stroke(); ctx.globalAlpha = 1;
  });

  // uwoo balls
  game.uwBalls.forEach(u=>{
    ctx.beginPath();
    ctx.arc(u.x,u.y,unitToPx(3)/2,0,Math.PI*2);
    ctx.fillStyle='#8c9199'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#3d4147'; ctx.stroke();
    ctx.beginPath();
    ctx.arc(u.x-4,u.y-4,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fill();
  });

  // donghoo muscles
  game.muscles.forEach(m=>{
    const mo = game.balls.find(x=>x.uid===m.ownerUid);
    if(m.workout>0) return;
    ctx.font = (unitToPx(3)*1.5)+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot||0);
    ctx.fillText('💪', 0, 0);
    ctx.restore();
    if(mo){
      ctx.font = '700 11px "Noto Sans KR", sans-serif';
      ctx.fillStyle = mo.color;
      ctx.fillText('Lv.'+mo.dh_level, m.x, m.y+unitToPx(3)*0.95);
    }
  });

  // hayul math balls
  game.mathballs.forEach(m=>{
    const r = unitToPx(m.size)/2;
    ctx.beginPath();
    ctx.arc(m.x,m.y,r,0,Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = BALL_TYPE_MAP['siyoon'].color;
    ctx.stroke();
    ctx.font = '700 '+Math.max(11, r*0.5)+'px "Noto Sans KR", sans-serif';
    ctx.fillStyle = '#141416';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(m.text, m.x, m.y);
  });

  // hanbin: 궤도를 도는 농구공
  game.balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='hanbin' || owner.hb_busy) return;
    const dist = unitToPx(7)/2 + unitToPx(owner.size)/2;
    const bx = owner.x + Math.cos(owner.hb_ballAngle)*dist;
    const by = owner.y + Math.sin(owner.hb_ballAngle)*dist;
    ctx.font = (unitToPx(3))+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏀', bx, by+1);
  });

  // hanbin: 날아가는 3점슛 농구공
  game.basketballs.forEach(p=>{
    ctx.font = (unitToPx(3))+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏀', p.x, p.y+1);
  });

  // uijoon like-swing icons
  game.balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='uijoon' || owner.oj_likeTimeLeft<=0) return;
    const dist = unitToPx(8)/2 + unitToPx(owner.size)/2;
    const likeR = unitToPx(3)/2;
    [0, Math.PI*2/3, Math.PI*4/3].forEach(offset=>{
      const angle = owner.oj_likeAngle + offset;
      const lx = owner.x + Math.cos(angle)*dist;
      const ly = owner.y + Math.sin(angle)*dist;
      ctx.font=(likeR*2.6)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('👍', lx, ly+1);
    });
  });

  // uijoon alarm pulses
  game.pulses.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,Math.max(0,p.radius),0,Math.PI*2);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // uijoon subscribe bell
  game.balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='uijoon' || !owner.oj_subscribeTargetUid) return;
    const target = game.balls.find(x=>x.uid===owner.oj_subscribeTargetUid);
    if(!target || target.eliminated) return;
    const mx = (owner.x+target.x)/2, my=(owner.y+target.y)/2;
    ctx.font='16px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔔', mx, my);
  });

  // 속도 버프 보라색 잔상 (50% 불투명, 오래될수록 흐려짐)
  game.balls.forEach(b=>{
    if(b.eliminated || b.eb_hidden || !b.trail || !b.trail.length) return;
    const r0 = unitToPx(b.size)/2;
    b.trail.forEach((p,idx)=>{
      const a = 0.2 * (idx+1)/b.trail.length;
      ctx.beginPath(); ctx.arc(p.x,p.y,r0,0,Math.PI*2);
      ctx.fillStyle = 'rgba(155,48,255,'+a.toFixed(3)+')';
      ctx.fill();
    });
  });

  // balls (이우섭 이동 중에는 맨 아래 레이어)
  [...game.balls].sort((p,q)=>((q.typeId==='uwoo'&&q.uw_state==='dash')?1:0)-((p.typeId==='uwoo'&&p.uw_state==='dash')?1:0)).forEach(b=>{
    if(b.eliminated || b.eb_hidden) return;
    if(b.chewedBy) return; // 씹히는 동안엔 모습이 사라지고 태민만 보임
    const r = unitToPx(b.size)/2;

    ctx.beginPath();
    ctx.arc(b.x,b.y,r,0,Math.PI*2);
    let fillCol = b.fillColor || b.color;
    b._textCol = getContrastColor(fillCol);
    b._renderFill = fillCol;
    ctx.fillStyle = fillCol;
    ctx.fill();
    ctx.lineWidth = (b.team==='red' || b.team==='blue' || b.isBoss) ? 4 : 2;
    ctx.strokeStyle = b.team==='red' ? '#e0263f' : (b.team==='blue' ? '#2f6fed' : (b.isBoss ? '#ffc82c' : 'rgba(0,0,0,0.55)'));
    ctx.setLineDash([]);
    ctx.stroke();
    ctx.setLineDash([]);

    if(b.isBoss){
      ctx.font = Math.max(14, r*0.5)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('👑', b.x, b.y - r - 10);
    }

    // 웅크리기: 파란 방어막
    if(b.typeId==='hayul' && b.hl_state==='spike'){
      const sr = r + 9;
      ctx.beginPath(); ctx.arc(b.x,b.y,sr,0,Math.PI*2);
      ctx.fillStyle = 'rgba(66,135,245,0.22)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,100,230,0.85)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x,b.y,sr-5,Math.PI*1.1,Math.PI*1.6);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
    }

    // 옐로카드 1장 표시
    if(b.yellowCards>=1){
      ctx.font = '16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🟨', b.x + r*0.75, b.y - r*0.75);
    }

    // F1 질주: 🏎를 탄 모습
    if(b.typeId==='eunchong' && b.f1_state==='active'){
      ctx.save();
      ctx.translate(b.x, b.y + r*0.1);
      if(b.vx>0) ctx.scale(-1,1);
      ctx.font = (r*2.1)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏎', 0, 0);
      ctx.restore();
    }

    // 구독 표시 (김동후 레벨 표시처럼 공 아래에 작게)
    if(b.oj_subSource!==undefined && b.oj_subTicks<7){
      ctx.font = '700 11px "Noto Sans KR", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = b.oj_subColor || '#ffb400';
      ctx.fillText('구독', b.x, b.y + r + 11);
    }

    // 버프 표시
    if(b.spdBuffTimer>0){
      ctx.font = '700 11px "Noto Sans KR", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = '#e0263f';
      ctx.fillText('속도×2', b.x, b.y - r - 10);
    }

    // direction indicator
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x+b.vx*(r+8), b.y+b.vy*(r+8));
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // name
    const fontSize = Math.max(9, Math.min(14, r*0.5));
    ctx.font = '700 '+fontSize+'px "Noto Sans KR", sans-serif';
    ctx.fillStyle = b._textCol;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.ballLabel||b.name, b.x, b.y);

    // virus skull indicator (top-left of the ball)
    if(b.virusStacks>0){
      const skullX = b.x - r*0.8, skullY = b.y - r*0.8;
      ctx.font = Math.max(12, r*0.7)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💀', skullX, skullY);
      if(b.virusStacks>1){
        ctx.font = '700 10px "Noto Sans KR", sans-serif';
        ctx.fillStyle = '#e0263f';
        ctx.fillText('x'+b.virusStacks, skullX, skullY + r*0.55);
      }
    }
  });

  // 최예성 글러브: 돌아가는 방향을 바라보도록 공 위에 그림
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  game.balls.forEach(owner=>{
    if(owner.eliminated || owner.chewedBy || owner.eb_hidden || owner.typeId!=='choiyeseong') return;
    const dist = unitToPx(9)/2 + unitToPx(owner.size)/2;
    const gr = unitToPx(GLOVE_SIZE)/2;
    const ang = owner.cy_gloveAngle;
    const gx = owner.x + Math.cos(ang)*dist;
    const gy = owner.y + Math.sin(ang)*dist;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(ang + Math.PI/2); // 돌아가는(진행) 방향을 바라보도록 회전
    ctx.font = (gr*2.4)+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🥊', 0, 1);
    ctx.restore();
  });
}

function getContrastColor(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), bl=parseInt(c.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*bl)/255;
  return lum > 0.6 ? '#141416' : '#ffffff';
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>볼파이트 예닮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141416;
    --paper:#ffffff;
    --line:#141416;
    --red:#ff2d55;
    --yellow:#ffc82c;
    --gray:#c9c9cc;
    --lightgray:#f2f2f4;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Black Han Sans','Noto Sans KR',sans-serif; letter-spacing:0.5px;}
  #app{
    width:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: max(20px, env(safe-area-inset-top,0px)) 16px max(20px, env(safe-area-inset-bottom,0px));
  }
  .screen{display:none; width:100%; max-width:1100px; flex-direction:column; align-items:center;}
  .screen.active{display:flex;}

  /* ---------- TITLE ---------- */
  #screen-title{justify-content:center; min-height:80vh; text-align:center; gap:28px;}
  .title-mark{
    font-size:20px; color:var(--red); font-weight:700; letter-spacing:6px;
  }
  .title-main{
    font-size:clamp(48px, 11vw, 108px);
    line-height:1.02;
    color:var(--ink);
    position:relative;
    display:inline-block;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    letter-spacing:0;
  }
  .title-main .accent{color:var(--red); font-weight:400;}
  .title-sub{font-size:15px; color:#555; max-width:420px; line-height:1.6;}
  .btn{
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;
    font-size:20px;
    padding:16px 46px;
    background:var(--ink);
    color:var(--paper);
    border:3px solid var(--ink);
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, color .12s ease;
    letter-spacing:1px;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0px) scale(0.98);}
  .btn.outline{background:var(--paper); color:var(--ink);}
  .btn.small{font-size:14px; padding:10px 22px; border-width:2px;}
  .btn.red{background:var(--red); border-color:var(--red);}
  .btn-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}

  /* ---------- SETUP ---------- */
  #screen-setup{gap:26px; padding-bottom:60px;}
  .setup-title{font-size:34px; margin:10px 0 0;}
  .setup-grid{
    width:100%;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  .ball-card{
    border:3px solid var(--ink);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 18px;
    background:var(--paper);
  }
  .ball-swatch{
    width:56px; height:56px; border-radius:50%;
    border:3px solid var(--ink);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans',sans-serif; color:var(--paper); font-size:13px;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .ball-info{flex:1; min-width:0;}
  .ball-info .bname{font-weight:700; font-size:17px;}
  .ball-info .bstat{font-size:12px; color:#666; margin-top:2px;}
  .ball-info .bskill{font-size:12.5px; color:#333; margin-top:6px; line-height:1.5;}
  .ball-info .bskill b{color:var(--red);}
  .stepper{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .stepper button{
    width:34px; height:34px; border:2px solid var(--ink); background:var(--paper);
    font-size:18px; font-weight:700; cursor:pointer; line-height:1;
  }
  .stepper button:active{background:var(--ink); color:var(--paper);}
  .stepper .count{width:24px; text-align:center; font-weight:700; font-size:18px;}

  .team-toggle{
    flex-shrink:0; min-width:0; max-width:100%; padding:9px 12px;
    border:2px solid var(--ink); background:var(--paper); color:var(--ink);
    font-weight:700; font-size:12.5px; cursor:pointer;
    white-space:nowrap; box-sizing:border-box;
  }
  .team-toggle.team-red{ background:#e0263f; border-color:#e0263f; color:#fff; }
  .team-toggle.team-blue{ background:#2f6fed; border-color:#2f6fed; color:#fff; }
  .intro-overlay{ display:none; position:absolute; inset:0; background:#000; color:#fff; align-items:center; justify-content:center; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size:clamp(28px,7vw,44px); letter-spacing:2px; z-index:9; pointer-events:none; }
  .setup-grid{ grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; }
  .ball-card{ flex-direction:column; flex-wrap:nowrap; gap:8px; padding:12px 8px; text-align:center; }
  .ball-card .ball-swatch{ width:54px; height:54px; }
  .ball-card .bname{ font-size:14px; font-weight:700; }
  .ball-card .team-toggle{ width:100%; }
  .ball-card .boss-controls{ width:100%; max-width:none; }
  .firework-text{ display:none; position:absolute; left:0; right:0; bottom:14px; text-align:center; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size:clamp(34px,9vw,52px); color:#ffd54f; text-shadow:0 0 12px rgba(255,120,0,0.9), 0 2px 0 #000; z-index:6; pointer-events:none; letter-spacing:4px; }
  .tag-head{ grid-column:1/-1; font-weight:700; font-size:15px; border-bottom:3px solid var(--ink); padding:6px 2px 4px; margin-top:6px; }
  .speed-controls{ position:absolute; top:6px; right:6px; display:flex; gap:4px; z-index:7; }
  .speed-btn{ border:2px solid var(--ink); background:rgba(255,255,255,0.92); color:var(--ink); font-weight:700; font-size:12px; padding:3px 9px; cursor:pointer; font-family:inherit; }
  .speed-btn.active{ background:var(--ink); color:#fff; }
  #screen-result{ position:relative; }
  .record-btn{ position:absolute; top:0; right:0; border:2px solid var(--ink); background:#fff; color:var(--ink); font-weight:700; font-size:14px; padding:8px 16px; cursor:pointer; font-family:inherit; }
  .record-btn:hover{ background:var(--ink); color:#fff; }
  .record-modal{ position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:center; justify-content:center; z-index:50; }
  .record-modal.open{ display:flex; }
  .record-panel{ width:min(92vw,400px); height:min(78vh,420px); background:#fff; border:3px solid var(--ink); display:flex; flex-direction:column; }
  .record-head{ display:flex; border-bottom:3px solid var(--ink); }
  .record-tab{ flex:1; padding:10px 2px; font-weight:700; font-size:13px; background:#fff; color:var(--ink); border:none; border-right:2px solid var(--ink); cursor:pointer; font-family:inherit; }
  .record-tab.active{ background:var(--ink); color:#fff; }
  .record-close{ width:40px; border:none; background:#fff; font-size:16px; font-weight:700; cursor:pointer; color:var(--ink); }
  .record-body{ flex:1; overflow-y:auto; padding:10px 12px; }
  .record-row{ margin-bottom:10px; font-size:13px; }
  .record-row .rline{ display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .record-row .rname{ font-weight:700; }
  .record-row .rbar{ height:8px; background:var(--lightgray); border:1px solid var(--ink); }
  .record-row .rfill{ height:100%; }
  .record-rank{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:14px; }
  .record-rank .rnum{ width:34px; font-weight:700; font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-size:16px; }
  .record-rank .rsub{ margin-left:auto; color:#777; font-size:12px; }
  .boss-controls{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; max-width:120px; }

  .mode-box{
    width:100%; border:3px solid var(--ink); padding:16px 18px;
  }
  .mode-box .label{font-weight:700; font-size:14px; margin-bottom:10px; letter-spacing:1px;}
  .mode-options{display:flex; gap:10px; flex-wrap:wrap;}
  .mode-opt{
    border:2px solid var(--ink); padding:10px 18px; cursor:pointer; font-weight:700; font-size:14px;
    background:var(--paper);
  }
  .mode-opt.active{background:var(--ink); color:var(--paper);}
  .setup-note{font-size:13px; color:#888; text-align:center;}
  .setup-footer{position:sticky; bottom:0; width:100%; display:flex; justify-content:center; padding-top:6px;}

  /* ---------- GAME ---------- */
  #screen-game{gap:14px;}
  .game-topbar{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--ink); padding-bottom:10px;
  }
  .game-topbar .glogo{font-size:22px;}
  .game-topbar .gtimer{
    font-family:'Black Han Sans',sans-serif; font-size:28px; letter-spacing:1px;
    background:var(--ink); color:var(--paper); padding:4px 16px;
  }
  .game-main{
    width:100%; display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;
  }
  .status-panel{
    width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
  }
  .status-card{
    border:2px solid var(--ink); padding:8px 10px; position:relative; overflow:hidden;
  }
  .status-card.dead{opacity:0.45;}
  .status-card .sname{font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
  .status-card .steam{font-size:9px; padding:1px 5px; border:1px solid var(--ink); margin-left:6px;}
  .status-card .shpwrap{
    margin-top:6px; height:10px; background:var(--lightgray); border:1px solid var(--ink);
  }
  .status-card .shpbar{height:100%; transition:width .2s ease;}
  .status-card .sgwrap{ margin-top:3px; height:6px; background:var(--lightgray); border:1px solid var(--ink); }
  .status-card .sgbar{ height:100%; width:0; transition:width .08s linear; }
  .status-card .shpnum{font-size:10px; color:#666; margin-top:2px; text-align:right;}
  .status-card .sdead-tag{font-size:10px; font-weight:700; color:var(--ink);}

  .board-wrap{
    position:relative;
    width:500px; height:500px; max-width:100%; aspect-ratio:1/1;
    border:4px solid var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 49px, #eee 49px, #eee 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, #eee 49px, #eee 50px),
      #ffffff;
    flex-shrink:0;
    touch-action:none;
  }
  #gameCanvas{position:absolute; top:0; left:0; width:100%; height:100%; display:block;}
  .banner-layer{
    position:absolute; top:6px; left:0; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    pointer-events:none; z-index:5;
  }
  .banner{
    background:rgba(255,255,255,0.92);
    border:2px solid var(--ink);
    padding:4px 12px;
    font-size:12.5px; font-weight:700;
    max-width:92%;
    text-align:center;
    animation:bannerIn .18s ease-out, bannerOut .35s ease-in forwards;
    animation-delay:0s, 2.1s;
  }
  @keyframes bannerIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes bannerOut{to{opacity:0;}}
  .banner .out-tag{font-weight:700; color:var(--ink);}

  .log-panel{
    flex:1; min-width:220px; height:500px; max-height:500px;
    border:2px solid var(--ink);
    display:flex; flex-direction:column;
  }
  .log-panel .log-head{
    background:var(--ink); color:var(--paper); font-weight:700; font-size:12px;
    padding:8px 10px; letter-spacing:1px;
  }
  .log-body{
    flex:1; overflow-y:auto; padding:8px 10px; font-size:12.5px; line-height:1.6;
  }
  .log-body::-webkit-scrollbar{width:6px;}
  .log-body::-webkit-scrollbar-thumb{background:var(--gray);}
  .log-line{margin-bottom:5px; word-break:keep-all;}
  .log-line .t{color:#aaa; font-size:10.5px; margin-right:5px;}

  .game-controls{width:100%; display:flex; justify-content:center; padding-top:2px;}

  /* ---------- RESULT ---------- */
  #screen-result{justify-content:center; min-height:70vh; gap:22px; text-align:center;}
  .result-tag{font-size:14px; letter-spacing:4px; color:#888; font-weight:700;}
  .result-winner{font-size:clamp(30px,7vw,54px);}
  .result-winner .wname{color:var(--red);}
  .result-sub{font-size:13px; color:#777;}

  @media (max-width:760px){
    .game-main{flex-direction:column; align-items:center;}
    .status-panel{width:100%; flex-direction:row; flex-wrap:wrap;}
    .status-card{flex:1 1 140px;}
    .board-wrap{width:100%; max-width:500px; height:auto;}
    .log-panel{width:100%; max-width:500px; height:220px; max-height:220px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="screen-title" class="screen active">
    <div class="title-mark">VOLFIGHT ARENA</div>
    <h1 class="title-main">볼파이트<br><span class="accent">예닮</span></h1>
    <p class="title-sub">랜덤한 자리에서 시작해, 부딪히고 튕기고 능력을 쓰며 마지막까지 살아남는 자가 승리하는 볼 배틀.</p>
    <button class="btn" id="btnGoSetup">시작하기</button>
  </section>

  <!-- SETUP -->
  <section id="screen-setup" class="screen">
    <h2 class="setup-title">게임 세팅</h2>

    <div class="mode-box">
      <div class="label">게임 모드</div>
      <div class="mode-options" id="modeOptions">
        <div class="mode-opt active" data-mode="solo">개인전</div>
        <div class="mode-opt" data-mode="team">팀전</div>
        <div class="mode-opt" data-mode="boss">보스</div>
      </div>
    </div>

    <div class="setup-grid" id="ballSetupGrid"></div>

    <p class="setup-note" id="setupNote">최소 2개 이상의 공을 선택해야 시작할 수 있어요.</p>

    <div class="setup-footer btn-row">
      <button class="btn outline" id="btnBackTitle">처음으로</button>
      <button class="btn" id="btnStartGame">게임 시작</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <div class="glogo display">볼파이트 예닮</div>
      <div class="gtimer" id="gameTimer">00:00</div>
    </div>
    <div class="game-main">
      <div class="status-panel" id="statusPanel"></div>
      <div class="board-wrap">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="banner-layer" id="bannerLayer"></div>
        <div class="firework-text" id="fireworkText">폭죽타임</div>
        <div class="speed-controls"><button class="speed-btn" id="btnSpeed2">x2</button><button class="speed-btn" id="btnSpeed3">x3</button></div>
      </div>
      <div class="log-panel">
        <div class="log-head">LIVE LOG</div>
        <div class="log-body" id="logBody"></div>
      </div>
    </div>
    <div class="game-controls">
      <button class="btn small outline" id="btnQuitGame">경기 중단</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="screen">
    <button class="record-btn" id="btnRecord">기록</button>
    <div class="result-tag">MATCH RESULT</div>
    <h2 class="result-winner" id="resultWinner">승자 : -</h2>
    <p class="result-sub" id="resultSub"></p>
    <div class="btn-row">
      <button class="btn" id="btnReplaySame">다시하기</button>
      <button class="btn outline" id="btnEditSetup">세팅 수정하기</button>
      <button class="btn outline" id="btnToTitle">처음으로</button>
    </div>
  </section>

  <div class="record-modal" id="recordModal">
    <div class="record-panel">
      <div class="record-head">
        <button class="record-tab active" data-rtab="dealt">준 피해량</button>
        <button class="record-tab" data-rtab="kills">막타 횟수</button>
        <button class="record-tab" data-rtab="rank">최종 순위</button>
        <button class="record-close" id="btnRecordClose">✕</button>
      </div>
      <div class="record-body" id="recordBody"></div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS
============================================================ */
const BOARD_UNITS = 50;
const PX_PER_UNIT = 10;               // 500px canvas / 50 units
const BOARD_PX = BOARD_UNITS * PX_PER_UNIT;
const GLOVE_SIZE = 5.5;               // 최예성 글러브 크기(지름, 5~6 범위)
const SPEED_K = PX_PER_UNIT * 4;      // 속도 스탯 × 4 = 초속(초당 이동 유닛 수). 예: 속도 5 = 초속 20

function unitToPx(u){ return u * PX_PER_UNIT; }

/* ============================================================
   BALL TYPE DEFINITIONS
============================================================ */
const BALL_TYPES = [
  {
    id:'kwontaemin', tag:'학생', name:'권태민', color:'#ff5fa2',
    hp:175, size:10, speed:2,
    skillName:'살찐 권태민',
    skillDesc:'다른 공과 4번 부딪히면 <b>"살을 뺀 권태민"</b>으로 변신(크기·속도 6). 살을 빼면 상대를 물어 3초간 40 대미지를 주고(그동안 상대는 화면에서 사라지고, 태민은 멈춰서 부들부들 떨림, 한 번에 한 명만 씹음) 10 HP를 회복한 뒤, 속도 50으로 뱉어버리고 다시 원래 모습으로 돌아옵니다. 살찐 상태로 돌아온 직후 1초간은 부딪혀도 변신 카운트가 오르지 않습니다. 살찐 상태일 땐 받는 대미지가 50% 감소합니다.'
  },
  {
    id:'kimsihoo', tag:'학생', name:'김시후', color:'#8a5a34',
    hp:160, size:7, speed:10,
    skillName:'은빈이 소환',
    skillDesc:'개구리 <b>은빈이</b>를 소환해 벽에 붙어있게 합니다. (김시후 본인은 은빈이에게 피해를 입지 않음) 은빈이에 닿으면 20 대미지를 입고, 은빈이는 다른 벽으로 점프합니다. 4.5초마다 "이기심이죠"를 외치며 은빈이를 추가 소환합니다.'
  },
  {
    id:'choiyeseong', tag:'학생', name:'최예성', color:'#3f7fd6',
    hp:170, size:7, speed:8,
    skillName:'회전 글러브',
    skillDesc:'주위를 도는 <b>글러브 1개</b>(크기 4~5)에 맞으면 26 대미지를 입고 속도 40으로 튕겨나갑니다. 10초마다 다리가 부러져 5초간 속도가 4로 느려집니다.'
  },
  {
    id:'uijoon', tag:'학생', name:'오의준', color:'#ffb400',
    hp:140, size:7, speed:10,
    skillName:'인플루언서',
    skillDesc:'6초마다 "브이로그 업로드"를 하며 셋 중 하나를 실행: <b>좋아요</b>(50%, 좋아요 3개를 휘둘러 맞으면 20 대미지) / <b>알림 설정</b>(30%, 파동이 다 퍼질 때까지 멈춰있다가 멀리까지 커지는 파동에 닿으면 50 대미지 + 0.5초 스턴) / <b>구독</b>(20%, 가까운 상대에게 "구독" 표시가 붙어 7초간 매초 10 대미지(총 70), 오의준은 붙지 않음).'
  },
  {
    id:'shinyechan', tag:'학생', name:'신예찬', color:'#2fa84f',

function totalBallCount(){
  if(setupState.mode==='team'){
    return Object.values(setupState.teamAssign).filter(v=>v!==null).length;
  }
  if(setupState.mode==='boss'){
    return Object.values(setupState.challengerCounts).reduce((a,b)=>a+b,0);
  }
  return Object.values(setupState.counts).reduce((a,b)=>a+b,0);
}
function teamCounts(){
  let red=0, blue=0;
  Object.values(setupState.teamAssign).forEach(v=>{ if(v==='red') red++; else if(v==='blue') blue++; });
  return {red,blue};
}

document.getElementById('modeOptions').addEventListener('click', (e)=>{
  const opt = e.target.closest('.mode-opt');
  if(!opt) return;
  setupState.mode = opt.dataset.mode;
  document.querySelectorAll('.mode-opt').forEach(o=>o.classList.toggle('active', o===opt));
  buildSetupGrid();
});

function buildSetupGrid(){
  const grid = document.getElementById('ballSetupGrid');
  grid.innerHTML = '';
  const mode = setupState.mode;
  // 태그(학생 / 선생님)별로 나눠서 표시, 각 그룹은 가나다 순
  const ordered = [];
  ['학생','선생님'].forEach(tg=>{
    const members = BALL_TYPES.filter(t=>(t.tag||'학생')===tg).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    if(members.length===0) return;
    ordered.push({head:tg+' ('+members.length+')'});
    members.forEach(t=>ordered.push(t));
  });
  ordered.forEach(t=>{
    if(t.head){ const h = document.createElement('div'); h.className = 'tag-head'; h.textContent = t.head; grid.appendChild(h); return; }
    const card = document.createElement('div');
    card.className = 'ball-card';
    let controlHtml;
    if(mode==='team'){
      controlHtml = teamToggleHtml(t.id);
    } else if(mode==='boss'){
      controlHtml = `
      <div class="boss-controls">
        ${bossToggleHtml(t.id)}
        ${t.bossOnly ? '' : participateToggleHtml(t.id,'challenger')}
      </div>`;
    } else {
      controlHtml = participateToggleHtml(t.id,'solo');
    }
    card.innerHTML = `
      <div class="ball-swatch" style="background:${t.fillColor||t.color};"></div>
      <div class="bname">${t.name}</div>
      ${controlHtml}
    `;
    grid.appendChild(card);
  });
  updateSetupNote();
}

function teamToggleHtml(id){
  const v = setupState.teamAssign[id];
  let label = '미선택', cls='team-toggle';
  if(v==='red'){ label='빨강팀'; cls+=' team-red'; }
  else if(v==='blue'){ label='파랑팀'; cls+=' team-blue'; }
  return `<button class="${cls}" data-teamid="${id}">${label}</button>`;
}

function bossToggleHtml(id){
  const isBoss = setupState.bossType===id;
  return `<button class="team-toggle${isBoss?' team-red':''}" data-bossid="${id}">${isBoss?'👑 보스':'보스로 선택'}</button>`;
}

function participateToggleHtml(id, pool){
  const countsObj = pool==='solo' ? setupState.counts : setupState.challengerCounts;
  const active = countsObj[id] > 0;
  return `<button class="team-toggle${active?' team-blue':''}" data-participate="${id}" data-pool="${pool}">${active?'참여':'미참여'}</button>`;
}

document.getElementById('ballSetupGrid').addEventListener('click', (e)=>{
  const teamBtn = e.target.closest('button[data-teamid]');
  const bossBtn = e.target.closest('button[data-bossid]');
  const partBtn = e.target.closest('button[data-participate]');
  if(teamBtn){
    const id = teamBtn.dataset.teamid;
    const cur = setupState.teamAssign[id];
    const next = cur===null ? 'red' : (cur==='red' ? 'blue' : null);
    setupState.teamAssign[id] = next;
    teamBtn.outerHTML = teamToggleHtml(id);
    updateSetupNote();
  } else if(bossBtn){
    const id = bossBtn.dataset.bossid;
    setupState.bossType = (setupState.bossType===id) ? null : id;
    document.querySelectorAll('button[data-bossid]').forEach(btnEl=>{
      btnEl.outerHTML = bossToggleHtml(btnEl.dataset.bossid);
    });
    updateSetupNote();
  } else if(partBtn){
    const id = partBtn.dataset.participate;
    const pool = partBtn.dataset.pool;
    const countsObj = pool==='solo' ? setupState.counts : setupState.challengerCounts;
    countsObj[id] = countsObj[id] > 0 ? 0 : 1;
    partBtn.outerHTML = participateToggleHtml(id, pool);
    updateSetupNote();
  }
});

function updateSetupNote(){
  const total = totalBallCount();
  const note = document.getElementById('setupNote');
  const startBtn = document.getElementById('btnStartGame');
  if(setupState.mode==='team'){
    const {red,blue} = teamCounts();
    if(red<1 || blue<1){
      note.textContent = '빨강팀과 파랑팀에 각각 최소 1개씩 배정해야 시작할 수 있어요. (빨강 '+red+' · 파랑 '+blue+')';
      startBtn.style.opacity = 0.4;
      startBtn.disabled = true;
    } else {
      note.textContent = '빨강팀 '+red+'개 · 파랑팀 '+blue+'개로 팀전을 시작합니다.';
      startBtn.style.opacity = 1;
      startBtn.disabled = false;
    }
    return;
  }
  if(setupState.mode==='boss'){
    const challengerTotal = total;
    if(!setupState.bossType || challengerTotal<4){
      note.textContent = '보스 1명과 도전자 최소 4명을 선택해야 시작할 수 있어요. (도전자 '+challengerTotal+'명)';
      startBtn.style.opacity = 0.4;
      startBtn.disabled = true;
    } else {
      note.textContent = BALL_TYPE_MAP[setupState.bossType].name+' 보스 vs 도전자 '+challengerTotal+'명으로 보스전을 시작합니다.';
      startBtn.style.opacity = 1;
      startBtn.disabled = false;
    }
    return;
  }
  if(total < 2){
    note.textContent = '최소 2개 이상의 공을 선택해야 시작할 수 있어요. (현재 '+total+'개)';
    startBtn.style.opacity = 0.4;
    startBtn.disabled = true;
  } else {
    note.textContent = '총 '+total+'개의 공으로 개인전을 시작합니다.';
    startBtn.style.opacity = 1;
    startBtn.disabled = false;
  }
}

/* ============================================================
   SOUND (Web Audio로 합성한 짧은 효과음, 외부 파일 없음)
============================================================ */
let audioCtx = null;
let lastSoundTime = {};
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playSound(type){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    // 같은 종류 효과음이 한 프레임에 너무 많이 겹치지 않도록 살짝 스로틀
    const now = ctx.currentTime;
    const minGap = type==='bounce' ? 0.03 : 0.05;
    if(lastSoundTime[type] && now-lastSoundTime[type] < minGap) return;
    lastSoundTime[type] = now;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    let freq=440, dur=0.08, wave='sine', vol=0.1;
    switch(type){
      case 'bounce': freq=260; dur=0.05; wave='square'; vol=0.05; break;
      case 'hit': freq=180; dur=0.09; wave='sawtooth'; vol=0.1; break;
      case 'skill': freq=700; dur=0.13; wave='triangle'; vol=0.1; break;
      case 'transform': freq=880; dur=0.22; wave='sine'; vol=0.11; break;
      case 'eliminate': freq=130; dur=0.35; wave='sawtooth'; vol=0.13; break;
      case 'win': freq=990; dur=0.4; wave='triangle'; vol=0.13; break;
      default: freq=440; dur=0.08;
    }
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.5), now+dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+dur);
    osc.start(now);
    osc.stop(now+dur+0.02);
  }catch(e){ /* 오디오 오류는 무시 (게임 진행에 영향 없음) */ }
}

function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }

function randomWallPoint(radius){
  const edge = randInt(0,3);
  const pad = radius+2;
  let x,y;
  if(edge===0){ x=rand(pad,BOARD_PX-pad); y=pad; }
  else if(edge===1){ x=rand(pad,BOARD_PX-pad); y=BOARD_PX-pad; }
  else if(edge===2){ x=pad; y=rand(pad,BOARD_PX-pad); }
  else { x=BOARD_PX-pad; y=rand(pad,BOARD_PX-pad); }
  return {x,y};
}

// 서로 너무 가까이 스폰돼서 능력이 바로 발동되는 걸 막기 위한 최소 간격
const SPAWN_GAP_PX = 90;
function pickSpawnPosition(radiusPx, placed){
  for(let attempt=0; attempt<300; attempt++){
    const x = rand(radiusPx+4, BOARD_PX-radiusPx-4);
    const y = rand(radiusPx+4, BOARD_PX-radiusPx-4);
    let ok = true;
    for(const p of placed){
      const d = Math.hypot(x-p.x, y-p.y);
      if(d < radiusPx + p.r + SPAWN_GAP_PX){ ok=false; break; }
    }
    if(ok) return {x,y};
  }
  // 자리를 못 찾으면(공이 너무 많은 경우) 간격 요구를 낮춰서라도 배치
  for(let attempt=0; attempt<300; attempt++){
    const x = rand(radiusPx+4, BOARD_PX-radiusPx-4);
    const y = rand(radiusPx+4, BOARD_PX-radiusPx-4);
    let ok = true;
    for(const p of placed){
      const d = Math.hypot(x-p.x, y-p.y);
      if(d < radiusPx + p.r + 10){ ok=false; break; }
    }
    if(ok) return {x,y};
  }
  return {x: rand(radiusPx+4, BOARD_PX-radiusPx-4), y: rand(radiusPx+4, BOARD_PX-radiusPx-4)};
}

/* ============================================================
   ENTITY FACTORIES
============================================================ */
let uidCounter = 1;
function nextUid(){ return uidCounter++; }

function spawnBall(typeId, index, teamIdx, placed, bossInfo){
  const t = BALL_TYPE_MAP[typeId];
  const isBoss = !!(bossInfo && bossInfo.isBoss);
  const sizeMult = (isBoss && !t.bossOnly) ? 1.5 : 1;
  const hpMult = (isBoss && !t.bossOnly) ? Math.max(1, bossInfo.hpMult) : 1;
  const actualSize = t.size * sizeMult;
  const radiusPx = unitToPx(actualSize)/2;
  let pos;
  if(typeId==='uwoo'){
    // 이우섭은 벽에서 시작 (벽에 있을 때만 스킬 사용 가능)
    pos = null;
    for(let q=0;q<80 && !pos;q++){
      const wp = randomWallPoint(radiusPx);
      wp.x = Math.max(radiusPx, Math.min(BOARD_PX-radiusPx, wp.x));
      wp.y = Math.max(radiusPx, Math.min(BOARD_PX-radiusPx, wp.y));
      if((placed||[]).every(p=>Math.hypot(wp.x-p.x,wp.y-p.y) > radiusPx+p.r+40)) pos = wp;
    }
    if(!pos) pos = randomWallPoint(radiusPx);
  } else {
    pos = pickSpawnPosition(radiusPx, placed||[]);
  }
  if(placed) placed.push({x:pos.x, y:pos.y, r:radiusPx});
  const ang = rand(0, Math.PI*2);
  const displayName = t.name + ((isBoss && !t.bossOnly) ? ' (보스)' : (index>0 ? ' '+(index+1) : ''));
  const b = {
    uid: nextUid(),
    kind:'ball',
    typeId, name: displayName, color: t.color, fillColor: t.fillColor||t.color, ballLabel: t.ballLabel||null, baseName: t.name, cs_phase:'move', cs_timer:0, cs_fwCount:0,
    hp: t.hp*hpMult, maxHp: t.hp*hpMult,
    baseSize: actualSize, baseSpeed: t.speed,
    size: actualSize, speedStat: t.speed,
    x: pos.x, y: pos.y,
    vx: Math.cos(ang), vy: Math.sin(ang),
    eliminated:false,
    team: teamIdx,
    isBoss, sizeMult,
    dmgMult: (isBoss && !t.bossOnly) ? Math.max(0, bossInfo.dmgMult) : 1,
    // override / status
    overrideSpeed:null,      // when set, use this speed stat instead
    bounceNeeded:0,          // collisions left before speed reverts
    statusTag:null,          // 'flying' etc, cosmetic
    // kwontaemin
    kt_mode: typeId==='kwontaemin' ? 'fat' : undefined,
    kt_hitCount: 0,
    kt_chewing: false,       // true while actively chewing someone
    kt_chewTimer: 0,
    kt_chewTarget: null,
    kt_cooldown:0,
    kt_hitCooldownMap: {},   // per-target cooldown so one sustained bump only counts once
    kt_chewAnchorX:0, kt_chewAnchorY:0, // freeze point while chewing (shakes around this)
    kt_hitImmuneTimer:0,     // grace period after reverting to fat mode
    // being-chewed (any ball)
    chewedBy: null,
    chewTimeLeft: 0,
    // kimsihoo
    ks_spawnTimer: 0,
    // choiyeseong
    cy_gloveAngle: rand(0,Math.PI*2),
    cy_legTimer: 0,
    cy_legBroken:false,
    cy_gloveCooldown: {}, // per target uid cooldown
    // uijoon
    oj_vlogTimer: 0,
    oj_pulseState: null, // null | 'charging' | 'active'
    oj_pulseTimer: 0,
    oj_likeTimeLeft: 0,
    oj_likeAngle: rand(0,Math.PI*2),
    oj_likeCooldown: {},
    oj_subscribeTargetUid: null,
    oj_subscribeTimeLeft: 0,
    oj_subscribeTick: 0,
    oj_subscribeAngle: 0,
    // shinyechan / virus (any ball can be infected, shinyechan itself is immune)
    virusStacks:0,
    virusInfectCooldown:0,
    virusDmgMult:1,
    // dongju
    dj_state: typeId==='dongju' ? 'anxious' : undefined,
    dj_timer: 0,
    dj_anchorX: pos.x, dj_anchorY: pos.y,
    dj_hitCooldown: {},
    // hayul
    hy_timer: 0,
    // hanbin
    // hyunseo
    hs_pauseTimer: 0, hs_pulls: 0,
    hs_anchorX: pos.x, hs_anchorY: pos.y, hs_hitCooldown: {},
    eb_intro: 0, eb_hiddenTimer:0, eb_hidden:false, eb_fishTimer:0, eb_graceTimer:0,
    dh_level: 1,
    f1_state:'cool', f1_timer:0, f1_turn:0, f1_hitCd:{}, flyUntilWall:false,
    nh_hitCd:{}, nh_pushTimer:0, yellowCards:0, expelTimer:0, expelSourceUid:null,
    hl_state:'wait', hl_timer:1, hl_next:'Q', hl_hitCd:{},
    kj_state:'cool', kj_timer:0, kj_target:null, spdBuffTimer:0, atkBuffTimer:0,
    uw_state:'wait', uw_timer:1, uw_dashT:0, uw_sx:0, uw_sy:0, uw_tx:0, uw_ty:0,
    hb_actionTimer: 0,
    hb_ballAngle: rand(0,Math.PI*2),
    hb_busy: false,
    hb_dashTargetUid: null,
    hb_dashSpeed: 0,
    hb_catchupTimer: 0,
    // generic status: stun (freeze+shake) and temporary size/speed debuff
    stunTimeLeft: 0, stunAnchorX: pos.x, stunAnchorY: pos.y,
    debuffTimeLeft: 0, debuffRevert: null,
  };
  return b;
}

============================================================ */
function buildRoster(){
  const roster = [];
  if(setupState.mode==='team'){
    BALL_TYPES.forEach(t=>{
      const v = setupState.teamAssign[t.id];
      if(v==='red' || v==='blue'){
        roster.push({typeId:t.id, index:0, team:v});
      }
    });
  } else if(setupState.mode==='boss'){
    BALL_TYPES.forEach(t=>{
      const n = setupState.challengerCounts[t.id];
      for(let i=0;i<n;i++){
        roster.push({typeId:t.id, index:i, team:'challenger'});
      }
    });
  } else {
    BALL_TYPES.forEach(t=>{
      const n = setupState.counts[t.id];
      for(let i=0;i<n;i++){
        roster.push({typeId:t.id, index:i, team:null});
      }
    });
  }
  // shuffle roster order for random spawn variety
  for(let i=roster.length-1;i>0;i--){
    const j = randInt(0,i);
    [roster[i],roster[j]] = [roster[j],roster[i]];
  }
  const placed = [];
  const balls = roster.map(r=>spawnBall(r.typeId, r.index, r.team, placed));

  if(setupState.mode==='boss' && setupState.bossType){
    const challengerCount = balls.length;
    const bossInfo = {
      isBoss:true,
      hpMult: Math.max(1, challengerCount),
      dmgMult: Math.max(0, challengerCount-2)
    };
    const bossBall = spawnBall(setupState.bossType, 0, 'boss', placed, bossInfo);
    balls.push(bossBall);
  }
  return balls;
}

function startGame(){
  stopGameLoop();
  const balls = buildRoster();
  const frogs = [];
  balls.forEach(b=>{
    if(b.typeId==='kimsihoo'){
      frogs.push(spawnFrog(b.uid));
    }
  });

  game = {
    balls, frogs,
    pulses: [],
    fishes: [],
    muscles: [],
    uwBalls: [],
    hairs: [],
    fireworks: [],
    blackout: false,
    waves: [],
    hasIntro: false,
    mathballs: [],
    basketballs: [],
    mode: setupState.mode,
    startTime: performance.now(),
    lastTime: performance.now(),

    finished:false,

  balls.filter(x=>x.typeId==='donghoo').forEach(x=>{

// 스킬 쿨타임 게이지: 횟수 조건=조건 달성마다 증가, 시간 조건=시간이 지날수록 증가, 지속 능력=사용 시간 동안 감소
function getGauge(b){
  const G = (p,mode)=>({pct:Math.max(0,Math.min(1,p)), mode:mode||'fill'});
  switch(b.typeId){
    case 'kwontaemin': {
      if(b.kt_chewing){ const t = game.balls.find(x=>x.chewedBy===b.uid); return G(t ? t.chewTimeLeft/3 : 0, 'drain'); }
      if(b.kt_mode==='thin') return G(1);
      return G(b.kt_hitCount/4);
    }
    case 'kimsihoo': return G(b.ks_spawnTimer/4.5);
    case 'choiyeseong': return b.cy_legBroken ? G(1-b.cy_legTimer/5,'drain') : G(b.cy_legTimer/10);
    case 'uijoon': {
      if(b.oj_likeTimeLeft>0) return G(b.oj_likeTimeLeft/2.5,'drain');
      if(b.oj_pulseState==='charging') return G(1,'drain');
      if(b.oj_pulseState==='active'){ const p = game.pulses.find(q=>q.ownerUid===b.uid); return G(p ? 1-p.radius/p.maxRadius : 0,'drain'); }
      return G(b.oj_vlogTimer/6);
    }
    case 'dongju': return b.dj_state==='anxious' ? G(b.dj_timer/11) : G(1);
    case 'siyoon': return G(b.hy_timer/4);
    case 'hayul': {
      if(b.hl_state==='wait') return G(1 - b.hl_timer/((b.hl_next==='W')?3:1));
      if(b.hl_state==='spike') return G(b.hl_timer/3,'drain');
      return G(1,'drain');
    }
    case 'hanbin': return b.hb_busy ? G(1,'drain') : G(b.hb_actionTimer/5);
    case 'hyunseo': return b.hs_pauseTimer>0 ? G(b.hs_pauseTimer/1,'drain') : G((b.hs_pulls||0)/4);
    case 'eunbin': return b.eb_hidden ? G(b.eb_hiddenTimer/3,'drain') : G((b.eb_wallHits||0)/4);
    case 'donghoo': { const m = game.muscles.find(x=>x.ownerUid===b.uid); return (m && m.workout>0) ? G(m.workout/3,'drain') : null; }
    case 'uwoo': return G((b.uw_songTimer||0)/3.6);
    case 'choiseunghyun': return b.cs_phase==='move' ? G(b.cs_timer/8) : G(1-b.cs_timer/4,'drain');
    case 'eunchong': return b.f1_state==='active' ? G(b.f1_timer/4.5,'drain') : G(b.f1_timer/6);
    case 'nohamin': return G(1 - Math.max(0,b.nh_cd||0)/5);
    case 'gippeum': {
      if(b.kj_state==='cool') return G(b.kj_timer/5);
      if(b.kj_state==='ready') return G(1);
      return G(b.kj_timer/2,'drain');
    }
  }
  return null;
}

function updateStatusPanel(){
  game.balls.forEach(b=>{
    const card = document.getElementById('status-'+b.uid);
    if(!card) return;
    const bar = card.querySelector('.shpbar');
    const num = card.querySelector('.shpnum');
    const pct = Math.max(0, b.hp/b.maxHp*100);
    bar.style.width = pct+'%';
    num.textContent = Math.max(0,Math.round(b.hp)) + ' / ' + b.maxHp + (b.typeId==='donghoo' ? '  Lv.'+b.dh_level : '');
    const nmEl = card.querySelector('.sname span');
    if(nmEl && nmEl.textContent!==b.name) nmEl.textContent = b.name;
    const g = b.eliminated ? null : getGauge(b);
    const gw = card.querySelector('.sgwrap'), gb = card.querySelector('.sgbar');
    if(gw && gb){
      gw.style.visibility = g ? 'visible' : 'hidden';
      if(g){
        gb.style.width = (g.pct*100)+'%';
        gb.style.background = g.mode==='drain' ? '#e0263f' : (g.pct>=0.999 ? '#ffc82c' : '#4a90d9');
      }
    }
    if(b.eliminated){
      card.classList.add('dead');
      if(!card.dataset.tagged){
        num.innerHTML = '<span class="sdead-tag">탈락</span>';
        card.dataset.tagged = '1';
      }
    }
  });
}
